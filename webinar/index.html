<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ACA X · AI Fundamentals for Product Managers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--surface:#0e0e10;--line:#242426;--green:#d0f539;--white:#fff;--muted:#8a8a90;
  --h:'Barlow',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--white);font-family:var(--b);overflow:hidden}
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:6vh 8vw;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.center{justify-content:center;text-align:center}
.wrap{width:100%;max-width:1180px}
.slide.center .wrap{max-width:1000px}
.kicker{font-family:var(--h);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
h1.title{font-family:var(--h);font-weight:800;text-transform:uppercase;font-size:clamp(34px,5.6vw,84px);line-height:.98;letter-spacing:-.01em}
.title .g{color:var(--green)}
.sub{font-size:clamp(17px,2vw,24px);color:var(--muted);margin-top:22px;max-width:840px;line-height:1.35}
.slide.center .sub{margin-left:auto;margin-right:auto}
.body{margin-top:26px;font-size:clamp(16px,1.5vw,20px);line-height:1.5}
.rule{width:72px;height:8px;background:var(--green);border-radius:2px;margin:24px 0}
.slide.center .rule{margin-left:auto;margin-right:auto}
.num{font-family:var(--h);font-weight:900;color:var(--green);font-size:clamp(90px,20vw,250px);line-height:.85;letter-spacing:-.03em}
.num.small{font-size:clamp(70px,12vw,140px)}
.cap{font-size:clamp(16px,1.6vw,22px);color:var(--muted);margin-top:12px;max-width:820px;line-height:1.4}
.cap b{color:#fff}
.src{font-size:12px;color:var(--line);margin-top:16px;letter-spacing:.04em;text-transform:uppercase}
.src b{color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
.block{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:18px 22px;background:linear-gradient(180deg,rgba(208,245,57,.03),transparent)}
.block .bl{font-family:var(--h);font-weight:800;text-transform:uppercase;color:var(--green);font-size:21px;letter-spacing:.02em}
.block p{color:var(--muted);margin-top:5px;font-size:15.5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.card{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surface)}
.card.bad{opacity:.6}.card.good{border-color:var(--green);box-shadow:0 0 0 1px rgba(208,245,57,.25)}
.card .tag{font-family:var(--h);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin-bottom:10px}
.card.bad .tag{color:var(--muted)}.card.good .tag{color:var(--green)}
.card p{font-size:16px;line-height:1.45}
.rows{margin-top:6px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:clamp(15px,1.6vw,20px)}
.row .a{color:var(--muted)}.row .arw{color:var(--green);font-family:var(--h);font-weight:800}.row .b{font-weight:600}.row .b b{color:var(--green)}
.turn{display:inline-block;font-family:var(--h);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--green);padding:6px 12px;border-radius:6px;font-size:13px;margin-bottom:16px}
.mono{font-family:var(--m);font-size:clamp(14px,1.4vw,17px);line-height:1.6;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:18px 20px;color:#e9e9ee}
.mono .c{color:var(--green)}
.checklist{list-style:none;margin-top:6px;font-size:clamp(16px,1.7vw,22px);line-height:1.85}
.checklist li:before{content:"›";color:var(--green);font-family:var(--h);font-weight:800;margin-right:14px}
.recaplist{list-style:none;margin-top:6px}
.recaplist li{display:flex;gap:18px;align-items:baseline;margin:8px 0;font-size:clamp(17px,1.8vw,24px)}
.recaplist .n{font-family:var(--h);font-weight:900;color:var(--green);font-size:34px;line-height:1;min-width:42px}
.poll{list-style:none;margin-top:12px}
.poll li{font-size:clamp(16px,1.7vw,22px);line-height:1.7;margin:6px 0}
.poll .n{font-family:var(--h);font-weight:900;color:var(--green);margin-right:14px}
.lifecycle{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-family:var(--h);font-weight:800;text-transform:uppercase;font-size:clamp(16px,2.2vw,30px)}
.lifecycle .n{color:var(--green)}
.twobars{display:flex;gap:26px;align-items:flex-end;height:32vh;margin-top:10px}
.bar{width:120px;background:var(--green);border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;color:var(--ink);font-family:var(--h);font-weight:900;font-size:26px}
.bar.small{opacity:.45}
.barlabel{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
.aster{display:inline-block;width:56px;height:56px;color:var(--green)}
.cubebox{margin-top:24px;display:flex;justify-content:center;perspective:900px}
.cube{width:150px;height:150px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-32deg);position:relative}
.cube .f{position:absolute;width:150px;height:150px;border:2px solid #2c2c2e;background:#0c0c0d}
.cube .top{transform:rotateX(90deg) translateZ(75px)}.cube .left{transform:rotateY(-90deg) translateZ(75px)}.cube .front{transform:translateZ(75px)}
.cube.lit .f{border-color:var(--green);background:rgba(208,245,57,.08);box-shadow:0 0 26px rgba(208,245,57,.55),inset 0 0 30px rgba(208,245,57,.25)}
.cube.lit{animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.tbar{width:180px;height:14px;background:var(--green);border-radius:3px;margin-top:30px}
.by{position:fixed;top:26px;right:28px;font-family:var(--h);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--muted);z-index:5}
.exrow{margin-top:14px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 10px;margin:4px 6px 0 0;font-family:var(--m);font-size:12.5px;color:#cfcfd4}
.chip.g{border-color:var(--green);color:var(--green)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;margin-top:8px}
.tgrp .tl{font-family:var(--h);font-weight:800;text-transform:uppercase;color:var(--green);font-size:13px;letter-spacing:.05em;margin-bottom:9px}
.tgrp .logos{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.tgrp .logos img{height:30px;width:auto;opacity:.92}
.tgrp .logos .tx{font-family:var(--h);font-weight:700;font-size:15px;color:#cfcfd4}
.org{width:100%;max-width:960px;margin:6px auto 0;display:block;height:auto}
.resdl{display:flex;gap:40px;align-items:center;margin-top:12px;flex-wrap:wrap}
.respreview{display:block;flex:0 0 auto}
.respreview img{width:300px;height:auto;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.55);transition:transform .2s}
.respreview:hover img{transform:translateY(-3px)}
.resmeta{flex:1;min-width:300px}
.dl{display:inline-block;margin:18px 0 8px;background:var(--green);color:#000;font-family:var(--h);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:15px;padding:14px 24px;border-radius:9px;text-decoration:none}
.dl:hover{filter:brightness(1.08)}
/* -- media components -- */
.profile{display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.profile img{width:230px;height:230px;object-fit:cover;border-radius:16px;border:2px solid var(--green)}
.profile ul{list-style:none}.profile li{font-size:clamp(16px,1.8vw,23px);line-height:1.95}
.profile li:before{content:"›";color:var(--green);font-weight:800;margin-right:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tile img{width:100%;height:30vh;object-fit:cover;object-position:top;display:block}
.tile .lab{padding:11px 13px;font-size:13px;color:var(--muted)}
.tile .lab b{display:block;color:var(--green);font-family:var(--h);text-transform:uppercase;font-size:14px;letter-spacing:.03em;margin-bottom:2px}
.mockcard{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;background:var(--surface);padding:20px 22px;max-width:840px;margin-top:8px}
.mockcard .q{color:var(--muted);font-size:14px;margin-bottom:10px;font-family:var(--m)}
.mockcard .a{font-size:clamp(16px,1.7vw,20px);line-height:1.5}
.mockcard .flag{margin-top:14px;color:var(--muted);font-family:var(--h);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.mockcard .flag s{color:#fff}
.ph{margin-top:8px;border:1.5px dashed rgba(208,245,57,.5);border-radius:12px;background:repeating-linear-gradient(45deg,rgba(208,245,57,.03),rgba(208,245,57,.03) 12px,transparent 12px,transparent 24px);min-height:32vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px}
.ph .pk{font-family:var(--h);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-size:13px;margin-bottom:8px}
.ph .pt{color:var(--muted);font-size:16px}
.contact{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center;margin-top:6px}
.contact .qr{width:210px;height:210px;background:#fff;border-radius:12px;padding:10px}
.contact .qr img{width:100%;height:100%;object-fit:contain}
.contact .row2{display:flex;gap:16px;align-items:baseline;margin:10px 0;font-size:clamp(16px,1.7vw,22px)}
.contact .k{color:var(--green);font-family:var(--h);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.06em;min-width:96px}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:9px 30px;margin-top:8px}
.modules div{display:flex;gap:12px;font-size:clamp(14px,1.5vw,19px)}
.modules .n{color:var(--green);font-family:var(--h);font-weight:800;min-width:22px}
.enroll{font-family:var(--h);font-weight:900;color:var(--green);font-size:clamp(22px,3vw,40px);letter-spacing:-.01em;margin-bottom:14px}
.logo{position:fixed;top:22px;left:26px;font-family:var(--h);font-weight:800;font-size:26px;letter-spacing:.02em;z-index:5;text-decoration:none;color:#fff}
.logo sup{color:var(--green);font-size:.6em}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--green);width:0;z-index:6;transition:width .4s ease}
.counter{position:fixed;bottom:18px;right:24px;font-family:var(--m);font-size:13px;color:var(--muted);z-index:6}
.counter b{color:#fff}
.hint{position:fixed;bottom:18px;left:26px;font-family:var(--m);font-size:12px;color:var(--line);z-index:6}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
.nav button{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:38px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
.nav button:hover{border-color:var(--green);color:var(--green)}
.notes{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,9,.97);border-top:2px solid var(--green);padding:18px 26px 22px;z-index:8;transform:translateY(110%);transition:transform .35s ease;max-height:42vh;overflow:auto}
.notes.on{transform:none}
.notes .nk{font-family:var(--h);font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-size:12px;margin-bottom:8px}
.notes .nt{font-size:17px;line-height:1.5;color:#e9e9ee;max-width:1000px}
.notes .vis{margin-top:10px;font-size:13px;color:var(--muted)}
@media (max-width:700px){.blocks,.cards,.tiles,.modules,.contact{grid-template-columns:1fr}}
</style>
</head>

<a class="logo" href="../index.html">ACA<sup>x</sup></a>
<div class="by">Tigran Sargsyan</div>
<div class="progress" id="prog"></div>
<div class="deck" id="deck"></div>
<div class="nav"><button id="prev">‹</button><button id="next">›</button></div>
<div class="counter"><b id="cur">1</b> / <span id="tot">36</span></div>
<div class="hint">← → navigate · F fullscreen</div>
<div class="notes" id="notes"><div class="nk">Speaker note</div><div class="nt" id="noteText"></div><div class="vis" id="visText"></div></div>
<script>
window.SLIDES = [
{sec:"COLD OPEN", center:true, title:`AI FUNDAMENTALS FOR <span class="g">PRODUCT MANAGERS</span>`,
 body:`<div class="sub">How the PM job is being rewritten, and how to be on the right side of it.</div>
   <div class="cubebox"><div class="cube"><div class="f top"></div><div class="f left"></div><div class="f front"></div></div></div>
   <div class="tbar" style="margin:26px auto 0"></div>
   <div class="sub" style="font-size:15px">Tigran Sargsyan · Senior Product Operations Manager, Picsart</div>`},

{sec:"HOW TONIGHT WORKS", title:`HOW TONIGHT <span class="g">WORKS</span>`,
 body:`<ul class="checklist"><li>~45 minutes, then open Q&A (about 60 total)</li><li>Recorded, and you'll get these slides + a downloadable resource pack</li><li>Drop questions in the chat any time, I'll read them out</li><li>If you can, turn your camera on, so we see each other and keep it interactive</li></ul>`},

{sec:"COLD OPEN", center:true, title:`THE QUESTION ISN'T <span class="g">"WILL AI TAKE MY JOB?"</span>`,
 body:`<div class="sub" style="color:#fff;font-size:clamp(19px,2.3vw,28px)">It's: will I be the PM who <span class="g">directs</span> AI, or the one who gets directed?</div>`},

{sec:"SENSE THE ROOM · 1", title:`HOW DO YOU USE <span class="g">AI TODAY?</span>`,
 body:`<div class="sub">Drop 1, 2, or 3 in the chat:</div>
   <ul class="poll"><li><span class="n">1</span> Proficient: I build with AI (websites, agents, automations)</li>
   <li><span class="n">2</span> Regular: I use it daily for real work (writing, research, analysis)</li>
   <li><span class="n">3</span> Beginner: I chat with ChatGPT or Claude now and then</li></ul>`},

{sec:"SENSE THE ROOM · 2", title:`AND <span class="g">WHO ARE YOU?</span>`,
 body:`<div class="sub">One more, drop 1, 2, or 3:</div>
   <ul class="poll"><li><span class="n">1</span> A PM, PO, BA or project manager (junior or senior)</li>
   <li><span class="n">2</span> Not a PM, but from tech: marketer, engineer, designer</li>
   <li><span class="n">3</span> Not in tech yet, exploring</li></ul>`},

{sec:"WHO AM I", title:`WHO <span class="g">AM I</span>`,
 body:`<div class="profile"><img src="../assets/img/tigran.jpg" alt="Tigran Sargsyan">
   <ul><li>5+ years at Picsart</li><li>Built 120+ AI agents</li><li>20+ websites & products (some I'll show today)</li><li>Mentored & coached 60+ PMs in courses and workshops</li></ul></div>`},

{sec:"THE SHIFT", center:true, title:`<span class="g">3</span> YEARS`,
 body:`<div class="num">3</div><div class="cap">Years for AI to reach ~50% of people. The internet took ~7. The PC took ~15.</div><div class="src"><b>Source:</b> CCIA / Stanford AI Index 2026</div>`},

{sec:"THE SHIFT", center:true, title:`<span class="g">900M</span> WEEKLY USERS`,
 body:`<div class="num small">900M</div><div class="cap">People use ChatGPT every week, close to a billion, and 1B+ monthly. Not a demo. Infrastructure.</div><div class="src"><b>Source:</b> OpenAI, 2026</div>`},

{sec:"THE SHIFT · WHAT IT DOES", title:`AI: <span class="g">FASTER AND BETTER</span> WORK`,
 body:`<div class="twobars"><div><div class="bar" style="height:60%">+25%</div><div class="barlabel">faster</div></div><div><div class="bar" style="height:92%">+40%</div><div class="barlabel">higher quality</div></div></div>
   <div class="cap">In a controlled study, professionals using AI worked ~25% faster and produced ~40% higher-quality work.</div><div class="src"><b>Source:</b> Harvard / BCG (758 consultants)</div>`},

{sec:"THE SHIFT · THE BELIEF", center:true, title:`AI AMPLIFIES <span class="g">WHO YOU ARE</span>`,
 body:`<div style="display:flex;justify-content:center;margin:14px 0"><svg class="aster" viewBox="0 0 100 100" fill="currentColor"><path d="M45 5h10v28l20-20 7 7-20 20h28v10H62l20 20-7 7-20-20v28H45V62L25 82l-7-7 20-20H10V45h28L18 25l7-7 20 20z"/></svg></div>
   <div class="sub" style="color:#fff">A sharp thinker gets sharper. A lazy one just gets louder.</div>`},

{sec:"WHAT IS AI, REALLY?", center:true, title:`WHAT IS AI, <span class="g">REALLY?</span>`,
 body:`<div class="rule"></div><div class="sub">Enough to trust it in the right places, and never the wrong ones.</div>`},

{sec:"HOW IT WORKS", title:`IT PREDICTS THE <span class="g">NEXT WORD</span>`,
 body:`<div class="mono" style="font-size:22px">"The cat sat on the ___"</div>
   <div style="margin-top:16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
   <span style="font-family:var(--h);font-weight:900;font-size:44px;color:var(--green)">mat</span>
   <span style="font-family:var(--h);font-weight:800;font-size:30px;color:#cfcfd4">floor</span>
   <span style="font-family:var(--h);font-weight:700;font-size:22px;color:var(--muted)">keyboard</span>
   <span style="font-size:16px;color:var(--line)">banana</span></div>`},

{sec:"HOW IT WORKS", title:`IT PREDICTS. <span class="g">IT DOESN'T KNOW.</span>`,
 body:`<div class="mockcard"><div class="q">"Cite a study on remote-work productivity."</div>
   <div class="a">"A 2019 Stanford study by Dr. Emily Chen found remote workers were 34% more productive (Journal of Labor Economics, vol. 47)."</div>
   <div class="flag">Looks authoritative. The study, the author, the journal: all invented.</div></div>
   <div class="cap">So verify facts, numbers and quotes. And never paste secrets, customer data or PII into a public AI.</div>`},

{sec:"HOW IT WORKS", title:`SUPERHUMAN AND <span class="g">CLUELESS</span> AT ONCE`,
 body:`<div class="cards"><div class="card good"><div class="tag">Brilliant</div><p>Wins a Math Olympiad gold medal</p></div><div class="card bad"><div class="tag">Clueless</div><p>Reads an analog clock right ~50% of the time</p></div></div><div class="src"><b>Source:</b> Stanford AI Index 2026</div>`},

{sec:"HOW IT WORKS", title:`MYTHS <span class="g">VS</span> REALITY`,
 body:`<div class="rows">
   <div class="row"><span class="a">"AI will replace me"</span><span class="arw">→</span><span class="b">replaces <b>tasks</b>, not people</span></div>
   <div class="row"><span class="a">"AI is always right"</span><span class="arw">→</span><span class="b">confident, <b>often wrong</b></span></div>
   <div class="row"><span class="a">"AI is only for engineers"</span><span class="arw">→</span><span class="b">for <b>anyone who thinks</b></span></div></div>`},

{sec:"THE ONE SKILL", center:true, title:`THE ONE <span class="g">SKILL</span>`,
 body:`<div class="rule"></div><div class="sub">How to actually talk to AI: the R·C·T·C prompt.</div>`},

{sec:"THE ONE SKILL", title:`THE <span class="g">R·C·T·C</span> PROMPT`,
 body:`<div class="blocks"><div class="block"><div class="bl">R · Role</div><p>Who it should be</p></div>
   <div class="block"><div class="bl">C · Context</div><p>About you + the situation</p></div>
   <div class="block"><div class="bl">T · Task</div><p>What you want + the format</p></div>
   <div class="block"><div class="bl">C · Critique</div><p>Make it challenge you</p></div></div>`},

{sec:"THE ONE SKILL", title:`BAD <span class="g">VS</span> GOOD PROMPT`,
 body:`<div class="cards"><div class="card bad"><div class="tag">✕ Bad</div><p>"Teach me product management."</p></div>
   <div class="card good"><div class="tag">✓ Good</div><p>"Act as a senior PM. I'm a marketer with no PM experience. Ask me questions first, then teach me PM with real marketing examples, and critique my understanding."</p></div></div>`},

{sec:"THE ONE SKILL", title:`TWO <span class="g">MULTIPLIERS</span>`,
 body:`<div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center"><div><div class="num small">5</div><div class="barlabel" style="text-align:left">exchanges to calibrate</div></div><div><div class="num small">50</div><div class="barlabel" style="text-align:left">variants for range</div></div></div>
   <div class="cap"><b>Iterate:</b> never accept the first answer. The third reply is usually the good one.</div>`},

{sec:"THE ONE SKILL", title:`STEAL THIS <span class="g">PROMPT</span>`,
 body:`<div class="mono">"Act as a <span class="c">career coach</span>. Ask me about my strengths and goals, suggest 2-3 paths, then <span class="c">critique</span> each and tell me what to build next."</div>
   <div class="cap">Try it tonight. Notice it interviews you first, then pushes back. That's R·C·T·C.</div>`},

{sec:"ACROSS THE JOB", center:true, title:`ACROSS THE <span class="g">WHOLE JOB</span>`,
 body:`<div class="rule"></div><div class="sub">Where AI shows up in the PM lifecycle.</div>`},

{sec:"ACROSS THE JOB", title:`THE PM <span class="g">LIFECYCLE</span>`,

{sec:"UNDER THE HOOD", center:true, title:`UNDER THE HOOD: <span class="g">THE MODERN AI STACK</span>`,
 body:`<div class="rule"></div><div class="sub">The words you'll keep hearing, and why a PM cares. No code.</div>`},

{sec:"UNDER THE HOOD", title:`ASSISTANT VS <span class="g">OPERATOR</span>`,
 body:`<div class="cards"><div class="card"><div class="tag" style="color:var(--muted)">Assistant · thinks</div><p>Answers, researches, explains, drafts. A brilliant advisor in the room. <b>You</b> still do the doing.</p><div class="exrow"><span class="chip">Claude</span><span class="chip">ChatGPT</span></div></div>
   <div class="card good"><div class="tag">Operator · does</div><p>Opens your tools, writes and runs code, builds and ships a website, sends the email, updates the data. A teammate at the keyboard.</p><div class="exrow"><span class="chip g">Claude Code</span><span class="chip g">Codex</span></div></div></div>
   <div class="cap">Same models. The difference is whether it can reach your tools and <b>take action</b>. Those apps I showed were built, not described.</div>`},

{sec:"UNDER THE HOOD", title:`MODELS: <span class="g">NOT ONE AI</span>`,
 body:`<ul class="checklist"><li>Claude, GPT, Gemini, plus open models, each with different strengths</li><li>Pick the model per task; the frontier changes almost monthly</li><li>Prices and limits vary a lot, so it's a product decision</li></ul>
   <div class="cap"><b>PM takeaway:</b> don't marry one model. Evaluate, and switch when a better one ships.</div>`},

{sec:"UNDER THE HOOD", title:`MCP + AGENTS: <span class="g">FROM CHAT TO ACTION</span>`,
 body:`<ul class="checklist"><li><b>MCP</b> is like USB-C for AI: a standard way to plug AI into your tools and data (files, databases, Slack, Figma)</li><li>An <b>agent</b> takes multi-step action with those tools, not just answers</li></ul>
   <div class="cap"><b>PM takeaway:</b> this is how AI goes from "chat" to "does the work in your stack." It's where the leverage is going.</div>`},

// -- engine --
const deck=document.getElementById('deck');
window.SLIDES.forEach(s=>{const el=document.createElement('section');el.className='slide'+(s.center?' center':'');
  el.innerHTML=`<div class="wrap"><div class="kicker">${s.sec||''}</div><h1 class="title">${s.title||''}</h1><div class="body">${s.body||''}</div></div>`;deck.appendChild(el);});
const slides=[...deck.querySelectorAll('.slide')];
const totEl=document.getElementById('tot');if(totEl)totEl.textContent=slides.length;
let i=0;const prog=document.getElementById('prog'),cur=document.getElementById('cur');
const notes=document.getElementById('notes'),noteText=document.getElementById('noteText'),visText=document.getElementById('visText');
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  if(prog)prog.style.width=((i+1)/slides.length*100)+'%';if(cur)cur.textContent=i+1;
  if(noteText)noteText.textContent=(window.SLIDES[i]&&window.SLIDES[i].note)||'';
  if(visText)visText.innerHTML=(window.SLIDES[i]&&window.SLIDES[i].vis)?('<b>Visual:</b> '+window.SLIDES[i].vis):'';
  location.hash=(i+1);}
function next(){show(i+1)}function prev(){show(i-1)}
const nb=document.getElementById('next'),pb=document.getElementById('prev');if(nb)nb.onclick=next;if(pb)pb.onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
  else if(e.key.toLowerCase()==='n'){notes&&notes.classList.toggle('on');}
  else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}});
show((parseInt(location.hash.replace('#',''))||1)-1);
</script>
