<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#d0f539;--muted:#8a8a90;--line:#2c2c30;--surf:#141416}
html,body{width:1160px;height:720px;background:#0b0b0c;color:#fff;
  font-family:system-ui,Arial,sans-serif;overflow:hidden}
.pk{position:absolute;top:34px;left:44px;font-size:14px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--green);font-weight:800}
.canvas{position:absolute;inset:0}
svg{position:absolute;inset:0;width:1160px;height:720px}
.node{position:absolute;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;
  padding:15px 17px;display:flex;flex-direction:column;gap:5px;z-index:2}
.node .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.node .t{font-size:17px;font-weight:600;color:#fff}
.node .ic{position:absolute;top:14px;right:15px;color:var(--green);font-size:15px}
.node.agent{border-color:var(--green);box-shadow:0 0 0 4px rgba(208,245,57,.08),0 0 24px rgba(208,245,57,.15)}
.node.agent .k{color:var(--green)}
.node.tool .k{color:var(--green)}
.node.done{border-color:var(--green);background:rgba(208,245,57,.06)}
.node.done .t{color:var(--green)}
</style></head><body>
<div class="pk">Agent Workflow</div>
<div class="canvas">
<svg viewBox="0 0 1160 720">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d0f539"/>
    </marker>
  </defs>
  <g fill="none" stroke="#d0f539" stroke-width="2.4" marker-end="url(#ar)">
    <path d="M232 353 L296 355"/>
    <path d="M512 330 C548 300, 552 200, 592 194"/>
    <path d="M512 355 L592 357"/>
    <path d="M512 382 C548 415, 552 516, 592 520"/>
    <path d="M796 194 C838 200, 862 300, 896 330"/>
    <path d="M796 357 L896 357"/>
    <path d="M796 520 C838 516, 862 415, 896 384"/>
  </g>
</svg>
<div class="node" style="left:44px;top:307px;width:188px;height:92px">
  <span class="ic">⚡</span><div class="k">Trigger</div><div class="t">New request</div></div>
<div class="node agent" style="left:302px;top:300px;width:210px;height:110px">
  <span class="ic">✦</span><div class="k">AI Agent · LLM</div><div class="t">Plans &amp; picks tools</div></div>
<div class="node tool" style="left:592px;top:152px;width:204px;height:84px">
  <span class="ic">◈</span><div class="k">Tool</div><div class="t">Web search</div></div>
<div class="node tool" style="left:592px;top:315px;width:204px;height:84px">
  <span class="ic">◈</span><div class="k">Tool</div><div class="t">Read CRM</div></div>
<div class="node tool" style="left:592px;top:478px;width:204px;height:84px">
  <span class="ic">◈</span><div class="k">Tool</div><div class="t">Run Python</div></div>
<div class="node done" style="left:896px;top:300px;width:210px;height:110px">
  <span class="ic">➤</span><div class="k">Output</div><div class="t">Deliver to Slack</div></div>
</div>
</body></html>
