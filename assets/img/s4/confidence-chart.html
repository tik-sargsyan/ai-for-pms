<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0b0b0c;--fg:#fff;--neon:#d0f539;--muted:#8a8a90;--line:#242426}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1160px;height:720px;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;overflow:hidden}
.wrap{padding:34px 44px 0;height:100%;display:flex;flex-direction:column}
h1{font-size:24px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
svg{display:block;margin-top:6px}
.foot{color:var(--muted);font-size:15px;text-align:center;margin-top:2px;line-height:1.5}
.foot b{color:var(--neon)}
</style></head><body>
<div class="wrap">
  <h1>Activation rate: point estimate vs. confidence range</h1>
  <div class="sub">Small samples &rarr; the range is wide &rarr; you don't actually know yet</div>
  <svg viewBox="0 0 1160 540" width="1072" height="500" aria-hidden="true">
    <!-- gridlines -->
    <g stroke="#242426" stroke-width="1">
      <line x1="180" y1="120" x2="1080" y2="120"/>
      <line x1="180" y1="235" x2="1080" y2="235"/>
      <line x1="180" y1="350" x2="1080" y2="350"/>
      <line x1="180" y1="465" x2="1080" y2="465"/>
    </g>
    <line x1="180" y1="580" x2="1080" y2="580" stroke="#3a3a3e" stroke-width="1.5"/>
    <!-- y labels -->
    <g fill="#8a8a90" font-size="15" text-anchor="end" font-family="ui-monospace,monospace">
      <text x="160" y="585">0%</text>
      <text x="160" y="470">25%</text>
      <text x="160" y="355">50%</text>
      <text x="160" y="240">75%</text>
      <text x="160" y="125">100%</text>
    </g>
    <!-- Variant A: point 67%, CI 39-87% -->
    <g stroke="#8a8a90" stroke-width="3" stroke-linecap="round">
      <line x1="430" y1="180" x2="430" y2="401"/>
      <line x1="408" y1="180" x2="452" y2="180"/>
      <line x1="408" y1="401" x2="452" y2="401"/>
    </g>
    <circle cx="430" cy="272" r="11" fill="#d0f539" style="filter:drop-shadow(0 0 12px rgba(208,245,57,.8))"/>
    <text x="466" y="278" fill="#d0f539" font-size="20" font-weight="600" font-family="ui-monospace,monospace">67%</text>
    <!-- Variant B: point 75%, CI 45-93% -->
    <g stroke="#8a8a90" stroke-width="3" stroke-linecap="round">
      <line x1="770" y1="152" x2="770" y2="373"/>
      <line x1="748" y1="152" x2="792" y2="152"/>
      <line x1="748" y1="373" x2="792" y2="373"/>
    </g>
    <circle cx="770" cy="235" r="11" fill="#d0f539" style="filter:drop-shadow(0 0 12px rgba(208,245,57,.8))"/>
    <text x="806" y="241" fill="#d0f539" font-size="20" font-weight="600" font-family="ui-monospace,monospace">75%</text>
    <!-- x labels -->
    <g fill="#fff" font-size="17" text-anchor="middle" font-family="ui-monospace,monospace">
      <text x="430" y="612">Variant A</text>
      <text x="770" y="612">Variant B</text>
    </g>
    <g fill="#8a8a90" font-size="14" text-anchor="middle" font-family="ui-monospace,monospace">
      <text x="430" y="634">n = 6</text>
      <text x="770" y="634">n = 4</text>
    </g>
  </svg>
  <div class="foot">The two ranges <b>overlap heavily</b>. B's point looks higher, but B could truly be lower than A. No winner yet.</div>
</div>
</body></html>
