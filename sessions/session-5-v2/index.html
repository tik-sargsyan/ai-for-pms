{sec:"SESSION 5 · OPEN", title:`FROM ASKING TO <span class="g">DELEGATING</span>`, center:true,
 body:`<div class="sub">Agents fundamentals. Tonight you hire your first AI helper, and a second one that checks its work.</div>
   <div style="display:flex;justify-content:center;margin:22px 0 4px">${AST}</div>
   <div class="tbar" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="font-size:16px">Tigran Sargsyan · AI for Product Managers · Session 5</div>`},

{sec:"RECAP · SESSIONS 2 TO 4", title:`WHAT YOU <span class="g">ALREADY HAVE</span>`,
 body:`<div style="max-width:720px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>A workspace folder with a CLAUDE.md and idea-scorer (S2).</span></li>
   <li><span class="n">2</span><span>A connector, discovery-synth, and prd.md with stories (S3).</span></li>
   <li><span class="n">3</span><span>data-analyst, a decision memo and a dashboard (S4).</span></li></ul></div>
   <div class="cap" style="max-width:760px;margin:16px auto 0">Tonight these become the tools your agents use.</div>`},

{sec:"SESSION 5 · OPEN", title:`TONIGHT YOU <span class="g">BUILD</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="two" style="max-width:820px;margin-left:auto;margin-right:auto;text-align:left">
   <div class="uc"><div class="t">1 · A custom subagent</div><div class="l">A helper with one job, its own instructions and only the tools it needs. <b>Discovery, Jira triage, competitor research or PRD review.</b></div></div>
   <div class="uc"><div class="t">2 · A judge agent</div><div class="l">A helper that scores one of your skills' output against a rubric and says <b>PASS or FAIL, and why.</b></div></div></div>
   <div class="sub" style="margin-left:auto;margin-right:auto">Both are plain files in your folder. Both are yours to keep.</div>`},

{sec:"WHAT AN AGENT IS", title:`AN AGENT IS <span class="g">FOUR THINGS</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · A model</div><p>The brain. Claude reads, plans and writes.</p></div>
   <div class="block"><div class="bl">2 · Tools</div><p>Hands. Read files, search the web, call Jira through a connector.</p></div>
   <div class="block"><div class="bl">3 · A loop</div><p>It acts, looks at the result, and decides the next step. Again and again.</p></div>
   <div class="block"><div class="bl">4 · A goal</div><p>A clear job and a clear "done". Without it, the loop has no end.</p></div></div>`},

{module:'agent-loop', scope:'lite', sec:"WHAT AN AGENT IS"},

{sec:"WHAT AN AGENT IS", title:`A CHATBOT ANSWERS. AN AGENT <span class="g">DOES</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">"Summarize my 12 interviews"</span><span class="arw">&rarr;</span><span class="b">opens all 12 files, finds themes, writes <b>synthesis.md</b> with quotes</span></div>
   <div class="row"><span class="a">"What changed in Jira this week?"</span><span class="arw">&rarr;</span><span class="b">calls the Jira connector, groups by status, flags <b>blockers</b></span></div>
   <div class="row"><span class="a">"Is this PRD ready?"</span><span class="arw">&rarr;</span><span class="b">reads the PRD, checks each section, returns a <b>gap list</b></span></div></div>`},

{module:'autonomy-levels', scope:'lite', sec:"WHAT AN AGENT IS"},

{module:'delegate-matrix', scope:'lite', sec:"WHAT AN AGENT IS"},

{sec:"SUBAGENTS", title:`A SUBAGENT IS A HELPER WITH <span class="g">ITS OWN DESK</span>`,
 body:`<div class="sub" style="color:var(--fg)">Your main Claude Code chat can hand a job to a <b class="g">subagent</b>: a separate helper that works on its own and reports back.</div>
   <ul class="checklist" style="margin-top:16px"><li><b>Own context window</b>: its own working memory, so your main chat stays clean</li><li><b>Own instructions</b>: one job, written once</li><li><b>Own tools</b>: only what the job needs, for example read-only</li><li><b>Returns a summary</b>: you get the result, not the mess</li></ul>`},

{module:'subagents', scope:'lite', sec:"SUBAGENTS"},

{sec:"SUBAGENTS", title:`ONE FILE, <span class="g">FOUR LINES</span> ON TOP`,
 body:`<div class="fileprev"><span class="d">.claude/agents/prd-reviewer.md</span>
<span class="k">---</span>
<span class="k">name:</span> prd-reviewer
<span class="k">description:</span> Reviews a PRD for gaps. Use when asked to check a PRD.
<span class="k">tools:</span> Read, Grep, Glob
<span class="k">model:</span> sonnet
<span class="k">---</span>
You are a strict senior PM. Check the PRD for: problem, user,
success metric, scope, risks, open questions. Return a table:
section, status (ok / weak / missing), one fix each.</div>
   <div class="cap" style="max-width:800px">Top part: <b>name</b> and <b>description</b> are required. <b>tools</b> and <b>model</b> are optional. Read, Grep and Glob mean read and search files only. Below the line: the instructions.</div>`},

{sec:"SUBAGENTS", title:`SKILL OR <span class="g">SUBAGENT?</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Skill</span><span class="arw">&rarr;</span><span class="b">a saved recipe. Runs <b>inside your chat</b>, with your chat's memory and tools.</span></div>
   <div class="row"><span class="a">Subagent</span><span class="arw">&rarr;</span><span class="b">a helper. Runs <b>on its own desk</b>, with its own memory and a tool limit.</span></div></div>
   <div class="cap" style="max-width:820px;margin:16px auto 0">Rule of thumb: pick a subagent when the job is <b>big</b> (many files), <b>noisy</b> (lots of reading), or needs <b>less access</b> than you have.</div>`},

{sec:"USE CASES", title:`FOUR PM AGENTS YOU CAN <span class="g">HIRE TONIGHT</span>`,
 body:`<div class="ucg">
   <div class="uc"><div class="t">Discovery agent</div><div class="l"><b>In:</b> interview notes, survey export. <b>Does:</b> tags pains, counts them, pulls quotes. <b>Out:</b> themes.md. <b>Tools:</b> read only.</div></div>
   <div class="uc"><div class="t">Jira triage agent</div><div class="l"><b>In:</b> new tickets via your connector. <b>Does:</b> sorts bug vs request, guesses priority, spots duplicates. <b>Out:</b> a triage table to approve.</div></div>
   <div class="uc"><div class="t">Competitor research agent</div><div class="l"><b>In:</b> 3 competitor names. <b>Does:</b> reads pricing and release pages. <b>Out:</b> what changed, with links. <b>Tools:</b> web, read only.</div></div>
   <div class="uc"><div class="t">PRD reviewer</div><div class="l"><b>In:</b> your PRD. <b>Does:</b> checks problem, metric, scope, risks. <b>Out:</b> a gap list with one fix each. <b>Tools:</b> read only.</div></div></div>`},

{sec:"USE CASES", title:`PICK BY YOUR <span class="g">BACKGROUND</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Growth or data PM</span><span class="arw">&rarr;</span><span class="b">experiment-reader: reads a results CSV, says <b>ship, kill or rerun</b></span></div>
   <div class="row"><span class="a">B2B or platform PM</span><span class="arw">&rarr;</span><span class="b">feedback-router: sorts sales call notes into <b>themes per account</b></span></div>
   <div class="row"><span class="a">Design-heavy PM</span><span class="arw">&rarr;</span><span class="b">ux-copy-checker: checks screen text for <b>tone and length</b></span></div>
   <div class="row"><span class="a">New to PM</span><span class="arw">&rarr;</span><span class="b">meeting-to-actions: turns notes into <b>owners and dates</b></span></div></div>`},

{sec:"AGENTS THAT BUILD AGENTS", title:`YOU DO NOT WRITE THE FILE. <span class="g">YOU DESCRIBE THE JOB</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:var(--fg)">Claude Code writes subagents and skills for you. Your job: say what good looks like, then <b class="g">read the file</b> before you trust it.</div>`},

{sec:"AGENTS THAT BUILD AGENTS · live", title:`LIVE · BUILD A <span class="g">PRD REVIEWER</span>`,
 body:`<span class="turn">Watch me first</span>
   <div class="mono"><ol class="steps2">
   <li><span class="c">"Create a subagent at .claude/agents/prd-reviewer.md. Job: review a PRD for gaps. Check problem, target user, success metric, scope, risks and open questions. Output: a table with section, status (ok, weak, missing) and one fix. Tools: read only. Ask me anything unclear first."</span></li>
   <li>I read the file. I check the description and the tools line.</li>
   <li><span class="c">"Use the prd-reviewer agent on prd.md."</span></li></ol></div>`},

{sec:"AGENTS THAT BUILD AGENTS · task", title:`TASK 1 · BUILD YOUR <span class="g">FIRST SUBAGENT</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono"><ol class="steps2">
   <li>Pick one: discovery, Jira triage, competitor research, PRD reviewer, or your own.</li>
   <li>Type: <span class="c">"Create a subagent at .claude/agents/[name].md. Job: [one sentence]. Input: [what I give it]. Output: [file or table]. Tools: [read only, or name the connector]. Ask me questions first."</span></li>
   <li>Answer its questions. Approve the file.</li>
   <li>Open the file. Read the description and tools lines.</li></ol></div>`},

{sec:"AGENTS THAT BUILD AGENTS · task", title:`TASK 2 · RUN IT, THEN <span class="g">TIGHTEN IT</span>`,
 body:`<span class="turn">Your turn · 8 min</span>
   <div class="mono"><ol class="steps2">
   <li>Run it on real input: <span class="c">"Use the [name] agent on [file or source]."</span></li>
   <li>Watch what it reads and which tools it uses.</li>
   <li>Then: <span class="c">"Did the [name] agent do anything outside its job? Tighten its description and tools so it cannot."</span></li>
   <li>Run it once more. Is the output better?</li></ol></div>`},

{module:'agent-failure-modes', scope:'lite', sec:"AGENTS THAT BUILD AGENTS"},

{sec:"BREAK", title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Back in about 8 min. Subagent not running? Grab me now.</div>`},

{sec:"THE JUDGE", title:`SCORE IT, <span class="g">DO NOT DICTATE IT</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:var(--fg)">AI output changes every run. You cannot check one exact answer.</div>
   <div class="sub">So you write down what good looks like, once, and let a <b class="g">judge</b> score every output against it.</div>`},

{module:'llm-judge', scope:'lite', sec:"THE JUDGE"},

{sec:"THE JUDGE", title:`ANATOMY OF A <span class="g">JUDGE</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · Criteria</div><p>3 or 4 only. For example: grounded, complete, clear, right format.</p></div>
   <div class="block"><div class="bl">2 · A scale</div><p>1 to 5 each. Say what a 1 and a 5 look like.</p></div>
   <div class="block"><div class="bl">3 · A hard fail</div><p>One rule that fails everything. For example: any number not in the source.</p></div>
   <div class="block"><div class="bl">4 · A verdict</div><p>PASS or FAIL, the reason, and the one fix that matters most.</p></div></div>`},

{sec:"THE JUDGE", title:`WHY THE JUDGE IS A <span class="g">SEPARATE AGENT</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Fresh eyes</span><span class="arw">&rarr;</span><span class="b">it did not write the output, so it does not <b>defend</b> it</span></div>
   <div class="row"><span class="a">Clean memory</span><span class="arw">&rarr;</span><span class="b">its own context window, only the rubric and the output</span></div>
   <div class="row"><span class="a">Read only</span><span class="arw">&rarr;</span><span class="b">a judge <b>scores</b>. It never edits the thing it grades.</span></div></div>`},

{sec:"THE JUDGE · task", title:`TASK 3 · BUILD YOUR <span class="g">JUDGE AGENT</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono"><ol class="steps2">
   <li>Pick one skill you built. Best picks: <span class="c">discovery-synth</span> (S3) or <span class="c">data-analyst</span> (S4).</li>
   <li>Type: <span class="c">"Create a subagent at .claude/agents/[skill]-judge.md. It scores the output of my [skill] skill. Criteria: [3 or 4]. Scale 1 to 5 with what a 1 and a 5 look like. Hard fail: [one rule]. Output: a score table, PASS or FAIL, and the top fix. Tools: Read only. It never edits files."</span></li>
   <li>Read the file. Is the hard fail clear?</li></ol></div>`},

{sec:"THE JUDGE · task", title:`TASK 4 · THE <span class="g">PLANT TEST</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono"><ol class="steps2">
   <li>Run your skill. Save the output: <span class="c">"Save that output to evals/good.md."</span></li>
   <li>Plant 2 bad ones: <span class="c">"Make evals/bad-fact.md with one invented number, and evals/bad-format.md with the right facts in the wrong format."</span></li>
   <li>Judge all three: <span class="c">"Use the [skill]-judge agent on every file in evals/. Show one table."</span></li>
   <li>Did it fail both bad files? If not, fix the rubric and rerun.</li></ol></div>`},

{sec:"THE JUDGE", title:`WHAT A GOOD RUN <span class="g">LOOKS LIKE</span>`,
 body:`<table class="sc"><tr><th>File</th><th>Grounded</th><th>Complete</th><th>Format</th><th>Hard fail</th><th>Verdict</th></tr>
   <tr><td>good.md</td><td>5</td><td>4</td><td>5</td><td>no</td><td class="g">PASS</td></tr>
   <tr><td>bad-fact.md</td><td>2</td><td>4</td><td>5</td><td>invented 38%</td><td class="w">FAIL</td></tr>
   <tr><td>bad-format.md</td><td>5</td><td>4</td><td>2</td><td>no</td><td class="w">FAIL</td></tr></table>
   <div class="cap" style="max-width:820px">Top fix for bad-fact.md: <b>"Remove 38%. It is not in the source data."</b></div>`},

{module:'eval-flywheel', scope:'lite', sec:"THE JUDGE"},

{sec:"THE JUDGE", title:`DOES THE JUDGE <span class="g">AGREE WITH YOU?</span>`,
 body:`<ul class="checklist"><li>Score 5 outputs yourself first. PASS or FAIL.</li><li>Run the judge on the same 5.</li><li>Agree on 4 of 5 or more? Trust it for this job.</li><li>Less? Make the rubric more specific and try again.</li></ul>
   <div class="cap" style="max-width:820px">This is called <b>calibration</b>: checking the judge against a human before you let it run alone.</div>`},

{module:'human-in-loop', scope:'lite', sec:"THE JUDGE"},

{sec:"USE CASES", title:`JUDGES FOR <span class="g">EVERY PM DESK</span>`,
 body:`<div class="ucg">
   <div class="uc"><div class="t">Research synthesis judge</div><div class="l">Hard fail: <b>any theme without a real quote.</b></div></div>
   <div class="uc"><div class="t">PRD judge</div><div class="l">Hard fail: <b>no success metric, or a metric with no number.</b></div></div>
   <div class="uc"><div class="t">Data readout judge</div><div class="l">Hard fail: <b>a number that does not match the source file.</b></div></div>
   <div class="uc"><div class="t">Release notes judge</div><div class="l">Hard fail: <b>a feature that is not in the shipped ticket list.</b></div></div></div>`},

{sec:"CHECKPOINT · DELIVERABLE", title:`CHECKLIST · <span class="g">TONIGHT'S BUILD</span>`,
 body:`<ul class="checklist">
   <li>A subagent file in <span class="g">.claude/agents/</span> with a clear description and limited tools</li>
   <li>It ran once on real input and you tightened it</li>
   <li>A judge agent file, read only, with criteria, scale, hard fail, verdict</li>
   <li>The plant test: the judge failed both bad files</li>
   <li>You checked the judge against your own scores</li></ul>`},

{sec:"RECAP &amp; HOMEWORK", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:720px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>An agent is a model, tools, a loop and a goal.</span></li>
   <li><span class="n">2</span><span>A subagent is a helper with its own desk. Describe the job, read the file.</span></li>
   <li><span class="n">3</span><span>A judge scores output against your rubric. Test it with planted mistakes.</span></li></ul></div>`},

{sec:"RECAP &amp; HOMEWORK", title:`HOMEWORK · <span class="g">JUDGE ONE MORE</span>`,
 body:`<div class="mono"><ol class="steps2">
   <li>Use your subagent on real work twice this week.</li>
   <li>Each time, run your judge on a skill's output and note the verdict.</li>
   <li>Fix the skill once based on the judge's top fix.</li></ol></div>
   <div class="cap" style="max-width:780px;margin:12px auto 0">Bring one judge verdict to Session 6. We put it on a schedule.</div>`},

{sec:"RECAP &amp; HOMEWORK · close", title:`NEXT · MULTI-AGENT AND <span class="g">AUTOMATION</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:var(--fg)">Session 6: Multi-agent and automation. A lead agent with a team of helpers, running every week on a schedule, packed as a plugin (one bundle of your skills and agents) you can share.</div>
   <div class="cubebox"><div class="cube"><div class="f top"></div><div class="f left"></div><div class="f front"></div></div></div>`},
];
</script>
