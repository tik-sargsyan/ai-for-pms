   <div class="row"><span class="a">1 · Your first skill</span><span class="arw">&rarr;</span><span class="b">your best G·C·O·C prompt from Session 2, saved as a skill</span></div>
   <div class="row"><span class="a">2 · A second skill</span><span class="arw">&rarr;</span><span class="b">for your own area: discovery, data, comms, reporting, visuals or video</span></div>

{module:'add-to-claude', scope:'lite'},

{sec:"YOUR FIRST SKILL", title:`YOU KEEP RETYPING THE <span class="g">SAME PROMPT</span>`, center:true,

   <div class="sub">A skill saves that prompt once, then runs it on command. Time to build one.</div>`},

{module:'skills-anatomy', scope:'full'},

{module:'claude-md-stack', scope:'skills'},

{sec:"YOUR FIRST SKILL", title:`THE EXAMPLE · <span class="g">PRD-WRITER</span>`,
 body:`<div class="sub">One skill turns any rough idea into the same one-page PRD, every time.</div>
   <div class="rows" style="margin-top:12px">
   <div class="row"><span class="a">You say</span><span class="arw">&rarr;</span><span class="b">"Write a PRD for one-click sign-up."</span></div>
   <div class="row"><span class="a">It writes 9 parts</span><span class="arw">&rarr;</span><span class="b">problem · users · goal metric · scope · out of scope · edge cases · risks · stories with tests · open questions</span></div>
   <div class="row"><span class="a">It flags</span><span class="arw">&rarr;</span><span class="b">everything it had to assume, so you check it</span></div></div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">Every PRD your team reads has the same shape. Reviewers know where to look.</div>`},

{sec:"YOUR FIRST SKILL · live", title:`LIVE · BUILD IT FROM <span class="g">ZERO</span>`,
 body:`<span class="turn">Watch me first</span>
   <div class="mono"><ol class="steps2">
   <li>In the demo folder, I tell Claude Code:<br><span class="c">"Create a skill at .claude/skills/prd-writer/SKILL.md. Name: prd-writer. Description: use this when I ask for a PRD or a spec. Steps: write a one-page PRD in 9 parts: problem, users, goal metric, scope, out of scope, edge cases, risks, stories with Given/When/Then tests, open questions. End with a list of what you assumed."</span></li>
   <li>Then: <span class="c">"Write a PRD for one-click sign-up for new users."</span></li>
   <li>It writes the file, then uses it. I approve each step.</li></ol></div>
   <div class="cap" style="max-width:800px;margin:12px auto 0">That is a skill: <b style="color:var(--accent)">written once, run forever.</b></div>`},

{sec:"YOUR FIRST SKILL · task", title:`NOW YOU · BUILD THE <span class="g">SKILL</span>`,
 body:`<span class="turn">Your turn · 8 min</span>
   <div class="mono"><ol class="steps2">
   <li>Same command I just ran: create <span class="c">.claude/skills/prd-writer/SKILL.md</span> with a name, a "use this when" description, and the 9 parts.</li>
   <li>Approve as it writes the file.</li>
   <li>Confirm the file exists in your folder.</li></ol></div>`},

{sec:"YOUR FIRST SKILL · checkpoint", title:`CHECKPOINT · YOUR SKILL <span class="g">RUNS</span>`,
 body:`<ul class="checklist"><li>SKILL.md exists in your folder</li><li>It wrote a PRD for a real idea</li><li>The PRD is saved as prd.md</li></ul>
   <div class="sub">That file and that skill are yours. This is tonight's milestone.</div>`},

{module:'toolbox-grid', scope:'skills'},

{module:'toolbox-grid', scope:'os-skills'},

{sec:"YOUR SECOND SKILL", title:`SKILL 2 · PICK ONE TO <span class="g">COPY</span>`,
 body:`<span class="turn">Your turn · 12 min</span>
   <div class="blocks" style="margin-top:4px;gap:12px">
   <div class="block"><div class="bl">Discovery</div><p><b>interview-synth</b>: paste notes, get pains, quotes and open questions.<br><b>review-miner</b>: app reviews in, top 5 themes out.<br><span class="rmk">Ready-made:</span> <a class="rm" href="https://github.com/anthropics/knowledge-work-plugins" target="_blank" rel="noopener">anthropics/knowledge-work-plugins</a></p></div>
   <div class="block"><div class="bl">Data</div><p><b>csv-analyst</b>: a CSV in, 3 findings and 1 chart idea out.<br><b>experiment-readout</b>: A/B numbers in, a plain verdict out.<br><span class="rmk">Ready-made:</span> <a class="rm" href="https://github.com/anthropics/skills" target="_blank" rel="noopener">anthropics/skills (xlsx)</a></p></div>
   <div class="block"><div class="bl">Execution</div><p><b>story-splitter</b>: a feature in, user stories with acceptance criteria out.<br><b>weekly-update</b>: notes in, a 5-bullet exec update out.<br><span class="rmk">Ready-made:</span> <a class="rm" href="https://github.com/anthropics/skills" target="_blank" rel="noopener">anthropics/skills (internal-comms)</a></p></div>
   <div class="block"><div class="bl">Strategy</div><p><b>pre-mortem</b>: a plan in, the top 5 ways it fails out.<br><b>one-page-strategy</b>: goal, bets, metrics, risks.<br><span class="rmk">Ready-made:</span> <a class="rm" href="https://github.com/anthropics/knowledge-work-plugins" target="_blank" rel="noopener">anthropics/knowledge-work-plugins</a></p></div></div>
   <div class="cap" style="max-width:860px;margin:12px auto 0">Ask Claude Code: <span style="font-family:var(--m);color:var(--accent)">"Create a skill called story-splitter that..."</span> Run it once on real input.</div>`},

{module:'hooks', scope:'lite'},

{module:'automation-roi', scope:'lite'},

   <div class="mono"><ol class="steps2">
   <li>Run your skill on a real idea. Type <span class="c">/prd-writer</span>, or just say:<br><span class="c">"Write a PRD for [one idea from your own backlog]."</span></li>
   <li>Then: <span class="c">"Save it as prd.md, and add a line to ideas.md with the date."</span></li>
   <li>Next week, one line writes the next PRD the same way.</li></ol></div>`},
