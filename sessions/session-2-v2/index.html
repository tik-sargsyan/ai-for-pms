{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 2 · OPEN THE <span class="g">CODE TAB</span>`,

   <li>Make a new folder <span class="c">ai-pm-course</span> and choose it as the session folder.</li>

{sec:"CLAUDE.MD + CONTEXT", title:`A NEW HIRE WITH <span class="g">NO ONBOARDING</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:var(--fg)">A blank Claude Code is a sharp new hire on day one.</div>
   <div class="sub">It knows a lot in general, and nothing about your company, your product, or your rules. The fix is one file.</div>`},

{sec:"CLAUDE.MD + CONTEXT", title:`CLAUDE.md · THE <span class="g">RULES</span>`,
 body:`<div class="sub">A plain text file (Markdown, the .md format) at the top of a project folder. Claude Code reads it every time, automatically.</div>
   <ul class="checklist"><li>What this project is</li><li>How you like to work</li><li>The conventions to follow</li><li>The safety lines it must not cross</li></ul>
   <div class="cap" style="max-width:840px;margin:12px auto 0">Example: <b>"This is the checkout backlog. Never use real customer data. Keep answers short and name the source."</b> Good CLAUDE.md, good behavior. Thin or missing, generic behavior.</div>`},

{module:'context-window', scope:'lite'},

{module:'context-compaction', scope:'lite'},

{module:'memory-types', scope:'lite'},

{sec:"CLAUDE.MD + CONTEXT · live", title:`LIVE · LET CLAUDE <span class="g">INTERVIEW YOU</span>`,
 body:`<span class="turn">Together · 15 min · paste this in your Code tab</span>
   <div class="mono" style="font-size:15px;line-height:1.5"><span class="c">I am new to Claude Code. My role is [X]. I work in the [X] industry. Help me set up my CLAUDE.md file with best practices. I am going to create a lot of different skills, connect to MCPs and tools, create and manage automations, agents and websites. Ask me a lot of questions first. Then, based on best practices, set up my CLAUDE.md file.</span></div>
   <div class="mono" style="margin-top:10px"><ol class="steps2">
   <li>Fill in your role and industry. Answer every question it asks.</li>
   <li>Read the draft. Ask for changes until it sounds like you. Then allow the save.</li>
   <li>Ask: <span class="c">"What do you know about me and this project?"</span> It answers from the file.</li></ol></div>`},

{sec:"WHERE IT ALL LIVES", title:`WHICH GOES <span class="g">WHERE</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Personal, always true</span><span class="arw">&rarr;</span><span class="b"><b>global</b> · your writing voice, your verify-facts rule</span></div>
   <div class="row"><span class="a">Product or team specific</span><span class="arw">&rarr;</span><span class="b"><b>project</b> · a payments compliance check, one product's release checklist</span></div></div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">Rule of thumb: if it should follow <b>you</b> everywhere, global. If it belongs to one product or one team, project.</div>`},
