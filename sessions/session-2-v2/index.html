{sec:"SESSION 2 · OPEN", title:`SET UP &amp; RUN YOUR <span class="g">AI-NATIVE WORKSPACE</span>`, center:true,

{sec:"RECAP · SESSION 1", title:`LAST TIME, THE THREE THAT <span class="g">STUCK</span>`,
 body:`<div style="max-width:680px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>It predicts plausible text. So you verify facts.</span></li>
   <li><span class="n">2</span><span>The frontier is jagged. So you learn the edge.</span></li>
   <li><span class="n">3</span><span>AI amplifies who you are. So you bring judgment.</span></li></ul></div>
   <div class="cap" style="max-width:760px;margin:16px auto 0">Session 1 gave you the instincts. Tonight you build the workspace those instincts run in.</div>`},

{sec:"SESSION 2 · OPEN", title:`WHAT YOU <span class="g">BUILD TONIGHT</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:#fff">One thing, in two parts: a <b style="color:var(--green)">working AI environment</b> on your machine, and <b style="color:var(--green)">your first skill</b> running inside it.</div>
   <div class="sub">Not a demo. Yours. It carries into every session after this.</div>`},

{sec:"SESSION 2 · OPEN", title:`SETUP <span class="g">STATUS CHECK</span>`,
 body:`<div class="sub">Quick hands up:</div>
   <ul class="checklist"><li>Who has a Claude Pro or Max account?</li><li>Claude desktop app installed and signed in?</li><li>Ran the pre-session checklist?</li></ul>`},

{sec:"SET UP YOUR WORKSPACE", title:`YOUR <span class="g">WORKSPACE</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Account. App. Claude Code. Everyone to the same green line.</div>`},

{module:'environments', scope:'lite'},

{module:'chatbot-vs-agent', scope:'lite'},

{module:'agent-loop', scope:'lite'},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 1 · GET TO <span class="g">GREEN</span>`,
 body:`<span class="turn">Your turn · 3 min</span>
   <div class="mono"><ol class="steps2">
   <li>Sign in at <span class="c">claude.ai</span>, or open the Claude desktop app.</li>
   <li>Send one message: <span class="c">"Reply with OK if you can read this."</span></li>
   <li>See the reply. Your account is live.</li></ol></div>`},

{sec:"SET UP YOUR WORKSPACE", cls:"viz", title:`THE APP, <span class="g">ONE SCREEN</span>`,
 body:`<div class="apptour">
   <div class="z side"><b>1 · Sessions</b><span>One per task. Start fresh, or go back to one.</span></div>
   <div class="z main"><div class="z top"><b>2 · Your folder</b><span>Claude Code works on the files here. Real files.</span></div>
     <div class="z chat"><b>3 · The conversation</b><span>You ask. It reads, acts, checks. Approvals show up here.</span></div>
     <div class="z input"><b>4 · Mode + model</b><span>How much it may do alone. Which model, how hard.</span></div></div>
   <div class="z pane"><b>5 · Changes</b><span>Every file it touched. Review before you trust.</span></div></div>
   <div class="src"><b>Schematic.</b> Labels match the Claude desktop app, Code tab.</div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 2 · OPEN THE <span class="g">CODE TAB</span>`,
 body:`<span class="turn">Your turn · 4 min</span>
   <div class="mono"><ol class="steps2">
   <li>Open the Claude desktop app. Click <span class="c">Code</span>.</li>
   <li>Make a new folder <span class="c">ai-pm-course</span> and choose it as the session folder.</li>
   <li>That folder is your project for the whole course. Everything Claude Code makes lands here.</li></ol></div>
   <div class="cap" style="max-width:820px;margin:14px 0 0">A folder is a project. Claude Code sees what is inside it, and nothing else on your laptop unless you allow it.</div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 3 · FIRST <span class="g">CLAUDE CODE</span> RUN`,
 body:`<span class="turn">Your turn · 6 min · token-light</span>
   <div class="mono"><ol class="steps2">
   <li>In your Code tab session, type your first ask.</li>
   <li><span style="color:var(--muted)">App will not open? Fallback, terminal. Mac: <span class="c">curl -fsSL https://claude.ai/install.sh | bash</span> · Windows: <span class="c">irm https://claude.ai/install.ps1 | iex</span>, then run <span class="c">claude</span>.</span></li>
   <li>One small command: <span class="c">"Create notes.md with the heading: My AI PM workspace."</span></li></ol></div>
   <img class="shot" style="max-height:27vh" src="../../assets/img/s2/claude-code-file.png"><div class="shotcap">Claude Code creating a real file on your machine</div>`},

{module:'permission-modes', scope:'lite'},

{sec:"SET UP YOUR WORKSPACE", cls:"viz", title:`READ THE ASK, <span class="g">THEN ALLOW</span>`,
 body:`<div class="askbox"><div class="ak">Claude Code wants to</div><div class="aw">Edit <span class="c">notes.md</span></div><div class="ad">+ 3 lines · 0 removed</div>
   <div class="abtn"><span class="y">Allow</span><span class="n">Deny</span></div></div>
   <div class="rows" style="margin-top:22px">
   <div class="row"><span class="a">What will it touch?</span><span class="arw">&rarr;</span><span class="b">a file, a command, a website</span></div>
   <div class="row"><span class="a">Is that what I asked?</span><span class="arw">&rarr;</span><span class="b">yes, Allow. Not sure, Deny and ask why</span></div></div>`},

{sec:"SET UP YOUR WORKSPACE", cls:"viz", title:`SEE IT, <span class="g">UNDO IT</span>`,
 body:`<div class="diffbox"><div class="df">notes.md</div>
   <div class="dl o">- # Notes</div><div class="dl g">+ # My AI PM workspace</div><div class="dl g">+ Goal: one skill by tonight</div></div>
   <div class="rows" style="margin-top:22px">
   <div class="row"><span class="a">Review</span><span class="arw">&rarr;</span><span class="b">open Changes: red removed, green added</span></div>
   <div class="row"><span class="a">Undo</span><span class="arw">&rarr;</span><span class="b">say "undo that change", or rewind to before it</span></div></div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TRY IT · <span class="g">PLAN FIRST</span>`,
 body:`<span class="turn">Your turn · 4 min</span>
   <div class="mono"><ol class="steps2">
   <li>Switch the mode to <span class="c">Plan</span>.</li>
   <li>Ask: <span class="c">"Plan a one-page onboarding checklist for a new PM, in onboarding.md."</span></li>
   <li>Read the plan. Change one thing. Then approve and let it write.</li></ol></div>
   <div class="cap" style="max-width:820px;margin:14px 0 0">Plan mode reads and proposes. It changes nothing until you say go.</div>`},

{sec:"SET UP YOUR WORKSPACE · checkpoint", title:`CHECKPOINT · <span class="g">EVERYONE GREEN</span>`,
 body:`<ul class="checklist"><li>Code tab open on your folder</li><li>Claude replies</li><li>Claude Code made a file</li></ul>
   <div class="sub">Stuck on any one? Pair up now. Nobody moves on stuck.</div>`},

{module:'model-picker', scope:'lite'},

{module:'effort-levels', scope:'lite'},

{sec:"CLAUDE.MD + CONTEXT", title:`A NEW HIRE WITH <span class="g">NO ONBOARDING</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:#fff">A blank Claude Code is a sharp new hire on day one.</div>
   <div class="sub">It knows a lot in general, and nothing about your bank, your product, or your rules. The fix is one file.</div>`},

{sec:"CLAUDE.MD + CONTEXT", title:`CLAUDE.md · THE <span class="g">RULES</span>`,
 body:`<div class="sub">A plain Markdown file at the top of a project. Claude Code reads it every time, automatically.</div>
   <ul class="checklist"><li>What this project is</li><li>How to run it</li><li>The conventions to follow</li><li>The safety lines it must not cross</li></ul>
   <div class="cap" style="max-width:840px;margin:12px auto 0">At a bank: <b>"This is the cards backlog. Never paste real card or KYC data. Keep answers short and cite the source."</b> Good CLAUDE.md, good behavior. Thin or missing, generic behavior.</div>`},

{module:'context-window', scope:'lite'},

{sec:"CLAUDE.MD + CONTEXT", title:`CONTEXT = ITS <span class="g">WORKING MEMORY</span>`,
 body:`<div class="sub">Everything loaded right now: your CLAUDE.md, the files you opened, this conversation. Nothing outside it exists to the model.</div>
   <img class="shot" src="../../assets/img/s2/context-chat.png"><div class="shotcap">A working session with the project context loaded in</div>`},

{sec:"CLAUDE.MD + CONTEXT · task", title:`TRY IT · YOUR FIRST <span class="g">CLAUDE.md</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono"><ol class="steps2">
   <li>In your Code tab, type <span class="c">/init</span>. It reads the folder and writes a CLAUDE.md.</li>
   <li>Then: <span class="c">"Add to CLAUDE.md: I am a PM at a bank. Keep answers short. Never invent facts. Never use real customer data."</span></li>
   <li>Then ask: <span class="c">"What is this project?"</span></li>
   <li>Watch it answer from the file you just wrote.</li></ol></div>`},

{sec:"WHERE IT ALL LIVES", title:`WHERE DOES IT ALL <span class="g">LIVE?</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:#fff">You will make skills, rules, and hooks.</div>
   <div class="sub">Each one lives in one of two places. Put it in the wrong one and it either follows you everywhere or nowhere.</div>`},

{module:'claude-md-stack', scope:'lite'},

{sec:"WHERE IT ALL LIVES", title:`WHICH GOES <span class="g">WHERE</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Personal, always true</span><span class="arw">&rarr;</span><span class="b"><b>global</b> · your writing voice, your verify-facts rule</span></div>
   <div class="row"><span class="a">Product or team specific</span><span class="arw">&rarr;</span><span class="b"><b>project</b> · a payments compliance check, this repo's build steps</span></div></div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">Rule of thumb: if it should follow <b>you</b> everywhere, global. If it belongs to one product or one team, project.</div>`},

{module:'hooks', scope:'lite'},

{sec:"BREAK", title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Back in ~8 min. If your setup fought you, grab me now and we fix it.</div>`},

{sec:"YOUR FIRST SKILL", title:`YOU KEEP RETYPING THE <span class="g">SAME PROMPT</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:#fff">Every week, the same long prompt to score a backlog idea.</div>
   <div class="sub">A skill saves that prompt once, then runs it on command. Time to build one.</div>`},

{module:'automation-roi', scope:'lite'},

{module:'skills-anatomy', scope:'lite'},

{sec:"YOUR FIRST SKILL", title:`THE EXAMPLE · <span class="g">IDEA-SCORER</span>`,
 body:`<div class="sub">In our demo project, one skill scores any backlog idea the same way every time: reach, effort, risk, a total, a call.</div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">So <b>"add instant KYC onboarding"</b> and <b>"redesign the card screen"</b> get judged on the same rubric, not on mood. Consistent scoring is the point.</div>`},

{sec:"YOUR FIRST SKILL · live", title:`LIVE · BUILD IT FROM <span class="g">ZERO</span>`,
 body:`<span class="turn">Watch me first</span>
   <div class="mono"><ol class="steps2">
   <li>In the demo folder, I tell Claude Code:<br><span class="c">"Create a skill at .claude/skills/idea-scorer/SKILL.md. Name: idea-scorer. Description: use this to score a product idea. Steps: rate reach, effort, and risk 1 to 5, then give a total and a ship or hold call."</span></li>
   <li>Then: <span class="c">"Score this idea: instant KYC onboarding for new current accounts."</span></li>
   <li>It writes the file, then uses it. I approve each step.</li></ol></div>
   <div class="cap" style="max-width:800px;margin:12px auto 0">That is a skill: <b style="color:var(--green)">written once, run forever.</b></div>`},

{sec:"YOUR FIRST SKILL · task", title:`NOW YOU · BUILD THE <span class="g">SKILL</span>`,
 body:`<span class="turn">Your turn · 8 min</span>
   <div class="mono"><ol class="steps2">
   <li>Same command I just ran: create <span class="c">.claude/skills/idea-scorer/SKILL.md</span> with a name, a "use this when" description, and the scoring steps.</li>
   <li>Approve as it writes the file.</li>
   <li>Confirm the file exists in your folder.</li></ol></div>
   <img class="shot" style="max-height:27vh" src="../../assets/img/s2/claude-code-file.png"><div class="shotcap">Claude Code writing your SKILL.md</div>`},

{sec:"YOUR FIRST SKILL · task", title:`WIRE ONE SMALL <span class="g">AUTOMATION</span>`,
 body:`<span class="turn">Your turn · 6 min</span>
   <div class="mono"><ol class="steps2">
   <li>Run your skill on a real idea. Type <span class="c">/idea-scorer</span>, or just say:<br><span class="c">"Score this idea: [one idea from your own backlog]."</span></li>
   <li>Then: <span class="c">"Save the idea and its score to ideas.md."</span></li>
   <li>Next week, one line reruns the whole thing.</li></ol></div>`},

{sec:"YOUR FIRST SKILL · checkpoint", title:`CHECKPOINT · YOUR SKILL <span class="g">RUNS</span>`,
 body:`<ul class="checklist"><li>SKILL.md exists in your folder</li><li>It scored a real idea</li><li>The score saved to ideas.md</li></ul>
   <div class="sub">That file and that skill are yours. This is tonight's milestone.</div>`},

{sec:"RECAP &amp; HOMEWORK", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:700px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>Claude Code is an operator. It reads, acts, checks. You approve.</span></li>
   <li><span class="n">2</span><span>CLAUDE.md is the rules, always in context. Global follows you, project stays put.</span></li>
   <li><span class="n">3</span><span>A skill is a saved recipe. Build once, run forever.</span></li></ul></div>`},

{sec:"RECAP &amp; HOMEWORK", title:`TONIGHT'S <span class="g">MILESTONE</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:#fff">A working AI environment on your machine, and your first skill running inside it.</div>
   <div class="sub">You are now set up the exact way I am. Every session after this builds on it.</div>`},

{sec:"RECAP &amp; HOMEWORK · capstone thread", title:`THIS IS YOUR <span class="g">CAPSTONE STACK</span>`,
 body:`<div class="sub">The environment you set up tonight is the one you ship your capstone on <b style="color:#fff">(Sessions 7-8)</b>. Your skills grow every session.</div>
   <div class="twobars" style="height:22vh;align-items:flex-end">
   <div class="bar" style="height:42%"></div>
   <div class="bar" style="height:70%"></div>
   <div class="bar" style="height:100%"></div>
   <span style="color:var(--green);font-family:var(--h);font-weight:900;font-size:44px;align-self:flex-start">&nearr;</span></div>`},

{sec:"RECAP &amp; HOMEWORK", title:`HOMEWORK · <span class="g">ONE SKILL</span>`,
 body:`<div class="sub">Build one skill for a task you do every week.</div>
   <div class="mono"><ol class="steps2">
   <li>Pick one recurring PM task: weekly update, meeting notes to actions, a competitor check.</li>
   <li>Ask Claude Code to write it as a <span class="c">SKILL.md</span>, the way you did tonight.</li>
   <li>Run it once on real input. Done.</li></ol></div>
   <div class="cap" style="max-width:780px;margin:12px auto 0">Token-light. One skill. That is the whole homework.</div>`},

{sec:"RECAP &amp; HOMEWORK · close", title:`NEXT · FROM <span class="g">RESEARCH TO SPEC</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:#fff">You have the workspace and your first skill. Next we turn real research into a PRD and stories.</div>
   <div class="cubebox"><div class="cube"><div class="f top"></div><div class="f left"></div><div class="f front"></div></div></div>`},
];
