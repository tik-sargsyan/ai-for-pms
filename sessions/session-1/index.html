 body:`<div class="sub" style="color:var(--fg)">There is still <span class="g">no strict definition</span> of AI.</div>
   <div class="cap" style="max-width:840px;margin:6px auto 18px">We have no strict definition of <b style="color:var(--fg)">human intelligence</b> either. Nobody can fully define thinking or understanding. So "artificial" intelligence has the same blur.</div>
   <div class="defbox"><div class="k">THE WORKING DEFINITION</div>
     <div class="t">A machine that does something we would call <b style="color:var(--accent)">intelligent</b> if a person did it.</div></div>
   <div class="src"><b>The AI effect:</b> once it works, we stop calling it AI. Chess, spam filters, autocomplete and face unlock are all "just software" now.</div>`},

{module:'ai-nesting', scope:'lite'},
