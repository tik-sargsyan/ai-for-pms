{module:'random-number', scope:'lite'},

{sec:"CHECK THE ANSWER", cls:"viz", title:`SAME DATA, <span class="w">TWO ANSWERS</span>`,
 body:`<div class="twonum">
   <div class="n"><div class="big">67%</div><p>Variant A, <b>blank rows removed</b>: 4 activated out of 6.</p></div>
   <div class="n r"><div class="big">57%</div><p>Variant A, <b>blank counted as no</b>: 4 activated out of 7.</p></div></div>
   <div class="cap" style="max-width:860px">One quiet choice moves the number 10 points. Claude made that choice for you in Task 1. Did it tell you?</div>`},

{sec:"CHECK THE ANSWER", title:`THREE CHECKS, <span class="g">EVERY NUMBER</span>`,
 body:`<div class="blocks" style="grid-template-columns:repeat(3,1fr);max-width:1040px">
   <div class="block"><div class="bl">Source</div><p>Which file or table? All rows, or only some? When was it pulled?</p></div>
   <div class="block"><div class="bl">Filters</div><p>Which dates? What was left out, and why? Blanks, test users, refunds?</p></div>
   <div class="block"><div class="bl">Counts</div><p>What did it count? Users or sessions? Signups or activations? How many rows?</p></div></div>
   <div class="cap" style="max-width:860px">If you cannot answer all three, you do not have a number yet. You have a guess.</div>`},

{sec:"CHECK THE ANSWER", title:`PASTE AFTER <span class="g">EVERY ANSWER</span>`,
 body:`<div class="mono" style="max-width:900px"><span class="c">"Which file and how many rows did you use?<br>
   What did you filter out, and why?<br>
   What exactly did you count: users, sessions or events?<br>
   Show the counts behind each percentage.<br>
   What would make this number wrong?"</span></div>`},

{module:'verification-ladder', scope:'lite'},

{sec:"READ AN EXPERIMENT", title:`PART 3 · <span class="g">REAL OR LUCK?</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Two ideas, no statistics degree: significance and ranges.</div>`},

{sec:"READ AN EXPERIMENT", cls:"viz", title:`TRUST THE <span class="g">RANGE</span>, NOT THE POINT`,
 body:`<div class="ci">
   <div class="r"><div class="lab">A · 4 of 6</div><div class="trk"><div class="rng" style="left:30%;width:60%"></div><div class="pt" style="left:67%"></div></div><div class="v">30 to 90%</div></div>
   <div class="r"><div class="lab">B · 3 of 4</div><div class="trk"><div class="rng" style="left:30%;width:65%"></div><div class="pt" style="left:75%"></div></div><div class="v">30 to 95%</div></div>
   <div class="ax"><div></div><div><span>0%</span><span>50%</span><span>100%</span></div><div></div></div></div>
   <div class="cap" style="max-width:880px"><b>Significance</b>: could luck explain the gap? <b>Range</b>: where the true rate probably is. These ranges almost fully overlap. We do not know yet.</div>
   <div class="src"><b>Math:</b> 95% Wilson interval on the demo file, blanks removed, rounded</div>`},

{sec:"READ AN EXPERIMENT", title:`FOUR TRAPS <span class="w">AI WALKS INTO</span>`,
 body:`<div class="rows" style="max-width:1000px">
   <div class="row"><span class="a"><b style="color:var(--fg)">Tiny sample</b></span><span class="arw">&rarr;</span><span class="b">Calls a winner on 10 users</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">Different windows</b></span><span class="arw">&rarr;</span><span class="b">Compares week 1 to week 2 as if it were fair</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">Cherry-picking</b></span><span class="arw">&rarr;</span><span class="b">Digs until one segment "works"</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">Correlation, not cause</b></span><span class="arw">&rarr;</span><span class="b">"Users who do X convert more" does not mean X causes it</span></div></div>`},

{sec:"DECIDE", title:`PART 4 · <span class="g">NUMBER TO DECISION</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">A number is not a decision. A decision says what we do next.</div>`},

{module:'delegate-matrix', scope:'lite'},

{sec:"DECIDE", cls:"viz", title:`THE DECISION MEMO, <span class="g">4 LINES</span>`,
 body:`<div class="memo">
   <div class="l"><b>Decision</b><span>Do not ship B yet. Run A and B at the same time for 2 weeks.</span></div>
   <div class="l"><b>Evidence</b><span>B 75% vs A 67%, but 4 and 6 users, different weeks. Checked: source, filters, counts.</span></div>
   <div class="l"><b>Confidence</b><span>Low. The ranges overlap almost fully.</span></div>
   <div class="l"><b>What would change my mind</b><span>B ahead by 5+ points on 500+ users per variant, same dates.</span></div></div>
   <div class="cap" style="max-width:860px">The last line earns trust. It shows you reason, not defend. Set the bar <b>before</b> the next test runs.</div>`},

{sec:"DECIDE · task", title:`TASK 3 · BUILD THE <span class="g">DATA SKILL</span>`,
 body:`<span class="turn">Your turn · 15 min</span>
   <div class="mono sm"><span class="c">"Create a skill at .claude/skills/data-analyst/SKILL.md.<br>
   Description: use when I ask a question about a data file, an experiment or a metric.<br>
   Steps: 1. Restate the question and the metric in one line. 2. Answer with numbers and the counts behind them. 3. Always report source, filters and what was counted. 4. If a choice changes the answer, such as blanks, show both versions. 5. For experiments: give the range, flag tiny samples, different time windows and correlation. 6. End with a 4-line decision memo: decision, evidence, confidence, what would change my mind. 7. Never invent numbers. If data is missing, say so."</span></div>
   <div class="cap" style="max-width:900px">Then run it: <b>"/data-analyst Should we ship B? Use data/onboarding-test.csv. Save the memo to decision.md."</b></div>`},

 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono sm"><ol class="steps2">
   <li>Read decision.md. Do you agree with the call? Change it if not. The decision is yours.</li>
   <li><span class="c">"Act as a skeptical VP. Give me the 3 hardest questions about decision.md."</span></li>
   <li>Answer them. Update the memo.</li>
   <li>Own data? <span class="c">"/data-analyst [your question from homework]. Use data/[your file].csv."</span> No own data? Use the practice set on the next slide.</li></ol></div>`},

   <div class="u"><b>Growth PM</b><span><i>Data:</i> PostHog funnel via MCP<br><i>Ask:</i> where do new users drop in week 1?</span></div>

{sec:"USE CASES", title:`DATA <span class="w">RED LINES</span>`,
 body:`<ul class="checklist" style="max-width:940px">
   <li>No names, emails, phone numbers or account IDs in your folder. Remove them, or use totals only.</li>
   <li>Warehouse access only through a connector your data team approves. Read only.</li>
   <li>Never paste a password, API key or token into a prompt.</li>
   <li>Before you share a dashboard, check who can open the link.</li></ul>`},

{sec:"RECAP", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:720px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>Ask in plain words. Check source, filters, counts.</span></li>
   <li><span class="n">2</span><span>Trust the range. Small samples tell you little.</span></li>
   <li><span class="n">3</span><span>A number is not a decision. Write the 4 lines.</span></li></ul></div>`},

{sec:"RECAP · checkpoint", title:`DELIVERABLE <span class="g">CHECKLIST</span>`,
 body:`<ul class="checklist">
   <li><span style="font-family:var(--m);color:var(--accent)">data-analyst</span> skill exists and runs</li>
   <li>Both blank rules shown for A and B, with counts</li>
   <li>decision.md: 4 lines, defended against the VP questions</li>
   <li>Dashboard artifact opens, every number matches the memo</li>
   <li>Optional: the skill ran on your own data</li></ul>`},

{sec:"HOMEWORK", title:`HOMEWORK · <span class="g">ONE REAL QUESTION</span>`,
 body:`<div class="mono"><ol class="steps2">
   <li>Run <span class="c">/data-analyst</span> on one real metric from your PRD. Totals only, no personal data.</li>
   <li>No real data? Run it on <a class="get" href="data/saas-accounts.csv" download>saas-accounts.csv</a>: <span class="c">"Does low weekly use predict churn? Is it cause, or only a link?"</span></li>
   <li>Write the 4-line memo. Show it to one person who owns that metric.</li>
   <li>Note one thing the skill missed. Add it to SKILL.md. Session 5 builds a judge for this skill.</li></ol></div>`},
