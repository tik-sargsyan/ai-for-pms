   <div class="cap" style="margin-left:auto;margin-right:auto">That gap is everything. Today we close it.</div>`},

{sec:`OPEN · CALIBRATE`, title:`CALIBRATE <span class="g">THE ROOM</span>`,
 body:`<div class="sub">One word in chat, or hands up: where is your prototype right now?</div>
   <div class="lifecycle" style="margin-top:22px"><span>Rough</span><span class="n">·</span><span>Working</span><span class="n">·</span><span>Proud</span><span class="n">·</span><span>Nervous</span></div>`},

{sec:`OPEN · THE BELIEF`, title:`SHIPPED BEATS <span class="g">PERFECT</span>`,
 body:`<div style="font-family:var(--h);font-weight:900;line-height:.9;letter-spacing:-.03em;margin-top:6px">
   <span class="g" style="font-size:clamp(70px,15vw,190px)">SHIPPED</span>
   <span style="font-size:clamp(28px,4.5vw,58px);color:var(--line);margin-left:14px">perfect</span></div>
   <div class="cap">Nobody remembers the prototype you polished forever. They remember the one you shipped. Done, live, and learning beats perfect and hidden.</div>`},

{sec:`WHERE TODAY SITS`, title:`THE LAST PIECE OF THE <span class="g">ANATOMY</span>`,
 body:`<div class="sub">All course you assembled the workspace. Two pieces make it real to the world:</div>
   <div class="cards"><div class="card good"><div class="tag">Deployment</div><p>Put it on the internet at a public address. Today: Vercel.</p></div>
   <div class="card good"><div class="tag">APIs</div><p>When AI runs inside your product, you own the model, the cost, and the guardrail.</p></div></div>
   <div class="cap">You do not write API code. You make four calls: which model, what quality bar, what cost, what judge sits around it.</div>`},

{sec:`POLISH & QA`, title:`POLISH & <span class="g">QA</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Make it safe to hand to a stranger. The last mile before live.</div>`},

{sec:`POLISH & QA · the gap`, title:`THE LAST-MILE <span class="g">GAP</span>`,
 body:`<div class="sub">A demo survives <b style="color:#fff">you.</b> A live product must survive <b style="color:#fff">a customer</b> who taps the wrong thing, on a phone, at a branch, on bad wifi.</div>
   <div class="lifecycle" style="margin-top:26px;font-size:clamp(14px,1.8vw,22px)"><span style="color:var(--green)">one happy path</span><span class="n">→</span><span>wrong button</span><span class="n">·</span><span>on a phone</span><span class="n">·</span><span>weird input</span><span class="n">·</span><span>bad wifi</span></div>`},

{sec:`POLISH & QA · framework`, title:`THE 8-POINT <span class="g">QA CHECKLIST</span>`,
 body:`<div class="mono">Ship-ready in 8 checks:<ol class="steps2">
   <li>First click works cold, no setup</li>
   <li>Core action runs end-to-end</li>
   <li>Empty and wrong input handled</li>
   <li>Readable on a phone</li>
   <li>No secrets or keys in the code</li>
   <li>No dead buttons or links</li>
   <li>A clear title, plus one line of "what is this"</li>
   <li>Loads in a few seconds</li></ol></div>`},

{sec:`POLISH & QA · guardrails`, title:`APPLY THE GUARDRAILS <span class="g">FROM DAY 6</span>`,
 body:`<div class="sub">If it uses AI, the "judge" ships too. Guardrails: validate input · handle the failure out loud · never show a raw error · keep it least-privilege.</div>
   <div class="cards" style="margin-top:18px"><div class="card bad"><div class="tag">Raw crash</div><p>A stack trace or a red error dumped on the customer.</p></div>
   <div class="card good"><div class="tag">Graceful</div><p>"Something went wrong. Please try again." Calm, plain, no internals.</p></div></div>`},

{sec:`POLISH & QA · your turn`, title:`YOUR <span class="g">TURN</span>`, center:true,
 body:`<span class="turn">Your turn</span><div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Ship-ready in a few tasks, then deploy. This session is the workshop.</div>`},

{sec:`POLISH & QA · task 1`, title:`TASK 1 · QA PASS WITH <span class="g">CLAUDE CODE</span>`,
 body:`<span class="turn">Task 1 · 12 min</span>
   <div class="mono">In Claude Code, one tight prompt:<ol class="steps2">
   <li>"Act as a QA engineer. Here is my app. Run this 8-point checklist and list what fails, most severe first."</li>
   <li>Fix the top 3 failures. Ask Claude Code to patch them one at a time.</li>
   <li>Confirm the core action works end-to-end, on a narrow phone-width window.</li></ol></div>`},

{sec:`DEPLOY · SHIP IT LIVE`, title:`SHIP <span class="g">IT</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">From localhost to a public URL. This is the part that makes it real.</div>`},

{sec:`DEPLOY · hosting`, title:`WHAT HOSTING <span class="g">ACTUALLY IS</span>`,
 body:`<div class="cards"><div class="card bad"><div class="tag">localhost</div><p>Only you, only while your laptop is on. Close it and it is gone.</p></div>
   <div class="card good"><div class="tag">Hosting</div><p>Your files on an always-on server, at a public address, for everyone.</p></div></div>`},

{sec:`DEPLOY · why vercel`, title:`WHY <span class="g">VERCEL</span>`,
 body:`<div class="sub">Free Hobby tier for demos · deploys in seconds · gives you <span style="font-family:var(--m);color:var(--green)">your-app.vercel.app</span> · HTTPS automatic · Claude Code drives it.</div>
   <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:26px;padding:40px;border:1px solid var(--line);border-radius:12px;background:#0e0e10">
     <img src="../../assets/img/logos/vercel.svg" alt="Vercel" style="width:clamp(48px,7vw,76px);height:auto">
     <span style="font-family:var(--h);font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:-.02em;color:#fff">Vercel</span></div>
   <div class="src"><b>Source:</b> Vercel pricing and docs, 2026 · internal deploy routing decision, 2026</div>`},

{sec:`DEPLOY · live block`, title:`LIVE: WATCH ME <span class="g">SHIP IT</span>`,
 body:`<div class="sub">I open our demo idea-scorer in Claude Code and deploy it to Vercel, start to finish. Watch, then you do the same with yours.</div>
   <div class="mono" style="margin-top:16px">I type into Claude Code, in plain English:<ol class="steps2">
   <li>"Install the Vercel CLI and log me in."</li>
   <li>"Deploy a preview of this app." I open the preview link, click the one action.</li>
   <li>"Ship it to production." I copy the <span class="c">.vercel.app</span> URL. It is live.</li></ol></div>`},

{sec:`DEPLOY · the flow`, title:`THE VERCEL <span class="g">FLOW</span>`,
 body:`<div class="cards"><div class="card good"><div class="tag">Path A · Claude Code + CLI</div><p>Everyone. <span style="font-family:var(--m);color:var(--green)">npx vercel</span> for a preview, then <span style="font-family:var(--m);color:var(--green)">vercel --prod</span>. Static or a build step, Vercel detects it.</p></div>
   <div class="card good"><div class="tag">Path B · Connect Git</div><p>If you used git in Session 2. Push to GitHub, import on vercel.com, every push redeploys.</p></div></div>
   <div class="cap">Not sure? Path A works for every project in this room. Ask Claude Code: "Does my app need a build step?"</div>`},

{sec:`DEPLOY · task 2`, title:`TASK 2 · DEPLOY <span class="g">YOUR CAPSTONE</span>`,
 body:`<span class="turn">Task 2 · 12 min</span>
   <div class="mono">Tell Claude Code, in plain English:<ol class="steps2">
   <li>"Install the Vercel CLI and start login." → <span class="c">npm i -g vercel</span>, then <span class="c">vercel login</span> (authorize once in the browser).</li>
   <li>"Deploy a preview of my app." → <span class="c">vercel</span> (zero config, it detects the setup).</li>
   <li>Open the preview URL. Click your core action. Does it work live?</li>
   <li>"Deploy to production." → <span class="c">vercel --prod</span>. Copy the URL it prints. It is live.</li></ol></div>`},

{sec:`DEPLOY · the moment`, title:`YOU HAVE <span class="g">A URL</span>`, center:true,
 body:`<div style="font-family:var(--h);font-weight:900;line-height:.92;letter-spacing:-.02em;margin:6px 0">
   <span style="font-size:clamp(20px,3vw,34px);color:var(--muted)">https://</span><span class="g" style="font-size:clamp(34px,7vw,86px)">your-app.vercel.app</span></div>
   <div class="sub">This is the moment. You own a public link. Send it to someone. Right now.</div>`},

{sec:`DEPLOY · name it`, title:`NAME <span class="g">IT</span>`,
 body:`<div class="sub">Make the link yours: on <b style="color:#fff">vercel.com</b> open the project, then Settings → Domains → rename to <span style="font-family:var(--m);color:var(--green)">your-app.vercel.app</span>. Free. Buying a real domain and pointing it here is optional, and not needed today.</div>`},

{sec:`DEPLOY · task 3`, title:`TASK 3 · SMOKE-TEST <span class="g">ON YOUR PHONE</span>`,
 body:`<span class="turn">Task 3 · 5 min</span>
   <div class="mono">Prove it's really live:<ol class="steps2">
   <li>Rename your site to something readable.</li>
   <li>Open the URL on your phone, not your laptop.</li>
   <li>Do the core action there, start to finish.</li>
   <li>Anything broken → one tight Claude Code fix → redeploy with <span class="c">vercel --prod</span>.</li></ol></div>`},

{sec:`BREAK`, title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div><div class="sub">You are LIVE. Back at <b style="color:#fff">[time]</b>.</div>`},

{sec:`MAKE IT LEARN`, title:`NOW MAKE <span class="g">IT LEARN</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">A live product with no feedback is a screenshot. Make it tell you what is happening.</div>`},

{sec:`MAKE IT LEARN · analytics`, title:`THE ONLY 3 NUMBERS <span class="g">YOU NEED</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">1 · Did anyone come?</span><span class="arw">→</span><span class="b">visits</span></div>
   <div class="row"><span class="a">2 · Did they do the ONE thing?</span><span class="arw">→</span><span class="b">the key action, say "ran an eligibility check"</span></div>
   <div class="row"><span class="a">3 · Where did they drop?</span><span class="arw">→</span><span class="b">the last step before they left</span></div></div>
   <div class="cap">That is a funnel. It tells you what to fix next. Everything else is noise until you have users.</div>`},

{sec:`MAKE IT LEARN · task 4`, title:`TASK 4 · ADD <span class="g">ANALYTICS</span>`,
 body:`<span class="turn">Task 4 · 6 min</span>
   <div class="mono">Pick one, ask Claude Code to wire it:<ol class="steps2">
   <li>Easiest on Vercel: turn on <b style="color:var(--green)">Vercel Web Analytics</b> in the project dashboard, then let Claude Code add the tag it gives you. Free, privacy-friendly.</li>
   <li>Zero setup: log the key action to the browser console or a simple counter so you can watch it live.</li>
   <li>Confirm a visit and one key action show up.</li></ol></div>`},

{sec:`MAKE IT LEARN · feedback loop`, title:`ONE QUESTION, <span class="g">ONE CHANNEL</span>`,
 body:`<div class="sub">The best feedback loop is <b style="color:#fff">small</b>: one honest question · one frictionless channel · you actually read it.</div>
   <div class="mono" style="margin-top:18px">"What's the one thing you'd fix?"</div>`},

{sec:`MAKE IT LEARN · task 5`, title:`TASK 5 · CLOSE <span class="g">THE LOOP</span>`,
 body:`<span class="turn">Task 5 · 6 min</span>
   <div class="mono">Ask Claude Code to add ONE (Vercel has no built-in forms):<ol class="steps2">
   <li>A "Give feedback" button that opens a free 3-field form (Tally or Google Form).</li>
   <li>Or a button with a <span class="c">mailto:</span> link straight to your inbox.</li>
   <li>Redeploy with <span class="c">vercel --prod</span>. Submit one test response yourself.</li></ol></div>`},

{sec:`LAUNCH & DEMO`, title:`<span class="g">LAUNCH</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Put it in front of people. A live thing nobody sees isn't launched.</div>`},

{sec:`LAUNCH & DEMO · 4 beats`, title:`THE 4-BEAT <span class="g">DEMO</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · Problem</div><p>10 seconds</p></div>
   <div class="block"><div class="bl">2 · Show it live</div><p>40 seconds</p></div>
   <div class="block"><div class="bl">3 · The one wow</div><p>20 seconds</p></div>
   <div class="block"><div class="bl">4 · The ask</div><p>20 seconds</p></div></div>
   <div class="cap">90 seconds total. Show, don't narrate.</div>`},

{sec:`LAUNCH & DEMO · script`, title:`THE DEMO SCRIPT <span class="g">TEMPLATE</span>`,
 body:`<div class="mono">Fill this in:<br><br>
   "I built <span class="c">___</span> because <span class="c">___</span>."<br>
   "Watch: I <span class="c">___</span> and it <span class="c">___</span>."<br>
   "The part I'm proud of: <span class="c">___</span>."<br>
   "It's live at <span class="c">[URL]</span>. Tell me the ONE thing to fix."</div>`},

{sec:`LAUNCH & DEMO · story`, title:`HOW I DEMO <span class="g">MY ARSENAL</span>`,
 body:`<div class="sub">One PM, directed AI well → a live command center, a search engine over 112 books, a full game. No hand-written code. Each demos in under a minute.</div>
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px">
     <figure style="margin:0"><img src="../../assets/img/command-center.png" alt="Agent Command Center" style="width:100%;height:26vh;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:10px;background:#0e0e10"><figcaption class="shotcap" style="margin-top:8px">Live command center</figcaption></figure>
     <figure style="margin:0"><img src="../../assets/img/book-rag.png" alt="Book RAG" style="width:100%;height:26vh;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:10px;background:#0e0e10"><figcaption class="shotcap" style="margin-top:8px">Search over 112 books</figcaption></figure>
     <figure style="margin:0"><img src="../../assets/img/catan.png" alt="A full game, shipped" style="width:100%;height:26vh;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:10px;background:#0e0e10"><figcaption class="shotcap" style="margin-top:8px">A full game, shipped</figcaption></figure></div>`},

{sec:`LAUNCH & DEMO · task 6`, title:`TASK 6 · WRITE YOUR <span class="g">DEMO</span>`,
 body:`<span class="turn">Task 6 · 8 min</span>
   <div class="mono"><ol class="steps2">
   <li>Fill the 4 blanks from the template (Problem · Show · Wow · Ask).</li>
   <li>Have your live URL open in a tab, on the core screen.</li>
   <li>Say it out loud once, to yourself. Cut anything past 90 seconds.</li></ol></div>`},

{sec:`COURSE WRAP`, title:`LOOK HOW <span class="g">FAR YOU CAME</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">8 sessions ago you were AI-curious. Today you shipped.</div>`},

{sec:`COURSE WRAP · payoff`, title:`THE CUBE, <span class="g">LIT</span>`, center:true,
 body:`<div class="cubebox"><div class="cube lit"><div class="f top"></div><div class="f left"></div><div class="f front"></div></div></div>
   <div class="sub" style="color:#fff">Same mind. Plugged in. <span class="g">Shipped.</span></div>`},

{sec:`COURSE WRAP · reframe`, title:`WHAT YOU <span class="g">ARE NOW</span>`,
 body:`<div class="sub" style="font-size:clamp(20px,2.2vw,28px)">You are not "a PM who uses ChatGPT." You are an <span class="g">AI-native PM</span>: a personal AI system · sharp judgment · and the ability to <span class="g">build and ship</span>.</div>`},

{sec:`MILESTONE`, title:`ONE THING TO <span class="g">LEAVE WITH</span>`, center:true,
 body:`<div class="num" style="font-size:clamp(38px,7vw,88px)">A LIVE URL</div>
   <div class="cap">A working product on the internet, at an address you can send anyone. That is today's milestone. You have it now.</div>`},

{sec:`HOMEWORK`, title:`<span class="g">ONE</span> TASK BEFORE YOU MOVE ON`,
 body:`<div class="sub">Share your live link and collect your first feedback.</div>
   <div class="mono">One task:<ol class="steps2">
   <li>Send your URL to 5 people: a teammate, a real user, the cohort channel.</li>
   <li>Ask each one question: "What is the one thing you would fix?"</li>
   <li>Write down what they say. Do not fix anything yet.</li></ol></div>`},

{sec:`AFTER THE COURSE · what next`, title:`KEEP THE <span class="g">MUSCLE ALIVE</span>`,
 body:`<div class="sub">Not homework, a habit:</div>
   <div class="blocks" style="margin-top:16px">
   <div class="block"><div class="bl">Build</div><p>Ship v1.1 from the feedback, then the next idea.</p></div>
   <div class="block"><div class="bl">System</div><p>Add one prompt, automation, or agent a week. It compounds.</p></div>
   <div class="block"><div class="bl">Current</div><p>One AI newsletter, 5 minutes a day.</p></div>
   <div class="block"><div class="bl">Community</div><p>Stay in the cohort. Share what you ship.</p></div></div>`},

{sec:`AFTER THE COURSE · close`, title:`GO <span class="g">BUILD</span>`, center:true,

   <div class="sub" style="font-size:16px">Thank you.</div>`}
