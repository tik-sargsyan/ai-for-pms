{sec:"SESSION 8 · OPEN", title:`TONIGHT YOU <span class="g">SHIP</span>`, center:true,

   <div class="sub">Shipped beats perfect. Live and learning beats polished and hidden.</div>`},

{sec:"GO ONLINE", cls:"viz", title:`HOW THE <span class="g">PIECES CONNECT</span>`,
 body:`<div class="flow">
   <div class="st"><b>Your folder</b><span>Claude Code writes and runs the code here.</span></div><div class="ar">&rarr;</div>
   <div class="st"><b>GitHub</b><span>Your code from Session 7, in a private repo.</span></div><div class="ar">&rarr;</div>
   <div class="st"><b>Vercel</b><span>Sees every push. Builds and deploys it.</span></div><div class="ar">&rarr;</div>
   <div class="st hot"><b>Your link</b><span>Push to a branch: preview. Push to main: production.</span></div></div>
   <div class="cap">Connect GitHub to Vercel once. After that, every push deploys by itself.</div>
   <div class="src"><b>Source:</b> vercel.com/docs/git, checked October 2026</div>`},

{sec:"GO ONLINE", cls:"viz", title:`PREVIEW TO <span class="g">PRODUCTION</span>`,
 body:`<div class="flow">
   <div class="st"><b>Branch v2</b><span>Tested on the preview URL.</span></div><div class="ar">&rarr;</div>
   <div class="st"><b>Pull request</b><span>v2 into main. Last review.</span></div><div class="ar">&rarr;</div>

{sec:"POLISH", title:`THE <span class="g">8-POINT</span> SHIP CHECK`,
 body:`<div class="blocks" style="grid-template-columns:repeat(4,1fr)">
   <div class="block"><div class="bl">1</div><p>First click works with no setup</p></div>
   <div class="block"><div class="bl">2</div><p>Core action works end to end</p></div>
   <div class="block"><div class="bl">3</div><p>Empty and wrong input handled</p></div>
   <div class="block"><div class="bl">4</div><p>Readable on a phone</p></div>
   <div class="block"><div class="bl">5</div><p>No secrets or keys in the code</p></div>
   <div class="block"><div class="bl">6</div><p>No dead buttons or links</p></div>
   <div class="block"><div class="bl">7</div><p>A title and one line: what is this</p></div>
   <div class="block"><div class="bl">8</div><p>Loads in a few seconds</p></div></div>`},

{module:'open-apis', scope:'lite', sec:"OPEN APIS"},

{sec:"MAKE IT LEARN", title:`THE ONLY <span class="g">3 NUMBERS</span>`,
 body:`<div style="max-width:760px;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span><b>Did anyone come?</b> Visitors.</span></li>
   <li><span class="n">2</span><span><b>Did they do the one thing?</b> The magic moment, counted.</span></li>
   <li><span class="n">3</span><span><b>What did they say?</b> Feedback answers. Read every one.</span></li></ul></div>
   <div class="cap">Everything else is noise until you have users.</div>`},

{sec:"NOW SHIP · task", title:`STEP 1 · PUT IT <span class="g">ONLINE</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono tight"><ol class="steps2">
   <li>Sign up at <span class="c">vercel.com</span> with GitHub. Choose the free <b>Hobby</b> plan.</li>
   <li>Go to <span class="c">vercel.com/new</span>. Pick your <span class="c">capstone</span> repo. Allow Vercel to see it if asked.</li>
   <li>Leave the settings as they are. Vercel detects Next.js. Click <b>Deploy</b>.</li>
   <li>Open the link on your phone. Your Session 7 app is online.</li></ol></div>
   <div class="src"><b>Source:</b> vercel.com/docs/git and /docs/plans/hobby, checked October 2026</div>`},

{sec:"NOW SHIP · task", title:`STEP 2 · THE SHIP <span class="g">PROMPT</span>`,
 body:`<span class="turn">Your turn · 40 min</span>
   <div class="cap" style="margin:0 0 10px">Code tab, your <span class="c">capstone</span> folder, <b>Plan</b> mode. Paste this. Swap the highlighted <b>[brackets]</b>.</div>
   <div class="mono tight" style="font-size:clamp(13px,1.25vw,16px);line-height:1.5"><span class="c">"Create a branch v2. Then plan these, one at a time:<br>
   1. QA: ask my judge agent to check the app against the acceptance criteria in PRD.md and the 8-point ship check. Fix the top 3 fails.<br>
   2. Open API: call <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[date.nager.at for public holidays]</b> from the server, cache the answer for one hour, and use it in the magic moment: <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[warn when an action item is due on a holiday]</b>. Show a friendly message if the API fails.<br>
   3. Add Vercel Web Analytics and a Give feedback link in the footer to <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[my form link]</b>.<br>
   Commit and push v2 after each step."</span></div>
   <div class="cap" style="margin-top:10px">Each push gives a v2 preview link in Vercel. Test every step there, on your phone too.</div>`},

{sec:"NOW SHIP · task", title:`STEP 3 · <span class="g">LAUNCH</span> IT`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono tight"><ol class="steps2">
   <li><span class="c">"Open a pull request from v2 into main if none exists. Then merge it with the GitHub CLI."</span></li>
   <li>Vercel, your project, <b>Overview</b>. Wait for the production build. Copy the domain, usually ending in <span class="c">.vercel.app</span>.</li>
   <li>Open it on your phone, on mobile data. Do the magic moment. Check the live data shows.</li>
   <li>Send the link to one person outside this room. Ask them the feedback question.</li></ol></div>`},

{sec:"WHEN IT BREAKS", title:`WHEN IT <span class="g">BREAKS</span>`,
 body:`<table class="tb">
   <tr><td>blank page</td><td>Open the browser console (Cmd+Option+J on Mac, Ctrl+Shift+J on Windows). Paste the red error to Claude Code.</td></tr>
   <tr><td>build failed</td><td>Copy the build log. <span class="c">"Fix this Vercel build error: [log]."</span></td></tr>
   <tr><td>open API fails</td><td>Check its limits and status page. Show a friendly message, use the cached answer.</td></tr>
   <tr><td>merge conflict</td><td><span class="c">"Explain this merge conflict in plain words, then fix it."</span></td></tr></table>`},

{sec:"DEMO DAY", title:`THE 3 MINUTE <span class="g">DEMO</span>`,
 body:`<div class="beats">
   <div><b>Problem</b><i>0:30</i><span>Who hurts, and how. One real example.</span></div>
   <div><b>Show it</b><i>1:00</i><span>Live link. Do the magic moment. No slides.</span></div>
   <div><b>Live data</b><i>0:45</i><span>The open API you added, and what your judge caught.</span></div>
   <div><b>Learned</b><i>0:25</i><span>One number, or one thing a user told you.</span></div>
   <div><b>Ask</b><i>0:20</i><span>"Open the link. Tell me the one thing to fix."</span></div></div>
   <div class="cap">Show, do not narrate. If it runs long, cut. Do not add.</div>`},

{sec:"DEMO DAY", title:`DEMO DAY · SHIP IT TO <span class="g">THE ROOM</span>`, center:true,
 body:`<div class="sub" style="color:var(--fg)">3 minutes each. Live URL on screen. Five beats.</div>
   <div class="sub">Then paste your link in the class chat. Everyone opens it and leaves one piece of feedback.</div>`},
