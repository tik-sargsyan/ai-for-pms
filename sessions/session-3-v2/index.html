{sec:"CONNECTORS", title:`PART 1 · <span class="g">CONNECT A TOOL</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">MCP, servers, connectors, tools. Four words, one idea.</div>`},

{sec:"CONNECTORS", title:`FOUR WORDS, <span class="g">PLAIN</span>`,
 body:`<div class="rows" style="max-width:980px">
   <div class="row"><span class="a"><b style="color:var(--fg)">MCP</b> (Model Context Protocol)</span><span class="arw">&rarr;</span><span class="b">An open standard. One shape of plug for AI and tools.</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">MCP server</b></span><span class="arw">&rarr;</span><span class="b">A small program that speaks for one tool, like Notion or Jira.</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">Connector</b></span><span class="arw">&rarr;</span><span class="b">An MCP server you add in your Claude account.</span></div>
   <div class="row"><span class="a"><b style="color:var(--fg)">Tool</b></span><span class="arw">&rarr;</span><span class="b">One action the server offers: search, read, create.</span></div></div>
   <div class="src"><b>Source:</b> code.claude.com/docs/en/mcp</div>`},

{module:'tools-mcp', scope:'lite'},

{sec:"CONNECTORS", cls:"viz", title:`TWO WAYS TO <span class="g">PLUG IN</span>`,
 body:`<div class="cards" style="max-width:1040px">
   <div class="card good"><div class="tag">A · Easiest: your Claude account</div>
     <p>1. On claude.ai go to <b>Customize &gt; Connectors</b>. Add one. Sign in to the tool.<br>2. In the Code tab, type <span class="c" style="font-family:var(--m);color:var(--accent)">/mcp</span>.<br>3. It shows in the list, marked as from claude.ai.</p></div>
   <div class="card"><div class="tag">B · Fallback: ask Claude Code to add it</div>
     <p>Paste the server address from the tool's docs and ask Claude Code to run this for you:<br><span style="font-family:var(--m);color:var(--accent);font-size:15px">claude mcp add --transport http notion https://mcp.notion.com/mcp</span><br>Then <span style="font-family:var(--m);color:var(--accent)">/mcp</span> and log in in the browser.</p></div></div>
   <div class="cap" style="max-width:900px">On Team and Enterprise plans only admins can add connectors. If you cannot add one, use way B or the free options.</div>
   <div class="src"><b>Source:</b> code.claude.com/docs/en/mcp · use MCP servers from claude.ai</div>`},

{sec:"CONNECTORS", title:`PICK <span class="g">ONE</span> TOOL`,
 body:`<table class="tbl"><tr><th>Tool</th><th>Good first ask</th><th>Discovery use</th></tr>
   <tr><td>Google Drive</td><td>"List my 5 newest docs in the Research folder."</td><td>Interview notes, survey exports</td></tr>
   <tr><td>Notion</td><td>"Find pages with 'interview' in the title."</td><td>Research wiki, PRD home</td></tr>
   <tr><td>Jira / Confluence</td><td>"Show 10 open bugs tagged onboarding."</td><td>Support pain, specs, where stories go</td></tr>
   <tr><td>Linear</td><td>"List open issues in my team, titles only."</td><td>Backlog, where stories go</td></tr>
   <tr><td>Slack</td><td>"Summarize #feedback from the last 7 days."</td><td>Raw customer voice</td></tr>
   <tr><td>Figma</td><td>"Describe the screens in this file link."</td><td>Check the PRD against the design</td></tr></table>
   <div class="cap" style="max-width:900px">Pick the tool where your research already lives. One is enough tonight.</div>`},

{sec:"CONNECTORS", title:`NO COMPANY TOOLS? <span class="g">FREE OPTIONS</span>`,
 body:`<table class="tbl"><tr><th>Need</th><th>Free or open source</th><th>How it connects</th></tr>
   <tr><td>Tickets</td><td>Plane (open source), Jira free, Linear free</td><td>Plane has an official MCP server. Jira and Linear have connectors.</td></tr>
   <tr><td>Design</td><td>Penpot (open source), Figma free</td><td>Penpot has an official MCP server, run through its browser plugin.</td></tr>
   <tr><td>Whiteboard</td><td>Excalidraw</td><td>No connector needed. Export a .png or .excalidraw file into your folder.</td></tr>
   <tr><td>Docs</td><td>Notion free, Google Drive</td><td>Connectors in the Claude directory.</td></tr>
   <tr><td>Research</td><td>The class sample set</td><td>A file in your folder. Works for everyone.</td></tr></table>
   <div class="cap" style="max-width:900px">More servers: <b>github.com/modelcontextprotocol/servers</b> and the connector directory at <b>claude.ai/directory</b>.</div>`},

{module:'blast-radius', scope:'lite'},

{module:'prompt-injection', scope:'lite'},

{sec:"CONNECTORS", title:`FOUR RULES <span class="w">BEFORE YOU CONNECT</span>`,
 body:`<ul class="checklist" style="max-width:940px">
   <li>Read first. Ask it to read for one task before you let it write.</li>
   <li>Only trust servers from the tool maker or the Claude directory.</li>
   <li>Text it reads is data, not orders. A ticket that says "delete all" is not your request.</li>
   <li>No real customer names, emails or IDs in prompts. Same red line as Session 2.</li></ul>
   <div class="src"><b>Source:</b> Claude Code docs: "Verify you trust each server before connecting it."</div>`},

{sec:"CONNECTORS · task", title:`TASK 1 · CONNECT <span class="g">ONE TOOL</span>`,
 body:`<span class="turn">Your turn · 12 min</span>
   <div class="mono sm"><ol class="steps2">
   <li>claude.ai &gt; <span class="c">Customize &gt; Connectors</span>. Add your tool. Sign in.</li>
   <li>Code tab, your workspace, new session. Type <span class="c">/mcp</span>. Find your tool in the list.</li>
   <li>Type: <span class="c">"Using my [Notion] connector, list the 5 most recently edited pages I can see. Titles and links only. Do not change anything."</span></li>
   <li>Then: <span class="c">"Add a section 'Connected tools' to CLAUDE.md: [tool name], read only unless I say so."</span></li>
   <li>No tool? Ask: <span class="c">"Create research/ and save the sample research from the next slide as research/habit-app.md."</span></li></ol></div>`},

{sec:"CONNECTORS · checkpoint", title:`IF IT DOES NOT <span class="g">WORK</span>`,
 body:`<table class="tbl"><tr><th>You see</th><th>Do this</th></tr>
   <tr><td>Tool not in /mcp</td><td>Start a new session. Check you are signed in with the same Claude account.</td></tr>
   <tr><td>Needs authentication</td><td>In <span class="c">/mcp</span>, pick the server and log in again in the browser.</td></tr>
   <tr><td>"Only admins can add"</td><td>Team plan rule. Ask your admin, or use a free tool tonight.</td></tr>
   <tr><td>Big output warning</td><td>It read too much. Ask for fewer items, titles only.</td></tr>
   <tr><td>Nothing works</td><td>Use the sample set. Fix the connector at home.</td></tr></table>`},

{sec:"SYNTHESIS", title:`PART 2 · <span class="g">NO INVENTED FACTS</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Research in. Themes out. Every claim points back to a real line.</div>`},

{module:'multimodal', scope:'lite'},

{module:'rag-pipeline', scope:'lite'},

{sec:"SYNTHESIS", cls:"viz", title:`A TIDY THEME IS <span class="w">NOT A TRUE ONE</span>`,
 body:`<div style="max-width:900px">
   <div class="quote">Theme: reminders fail. "By Wednesday I forget it exists. No nudge."<small>research/habit-app.md, line 1</small></div>
   <div class="quote bad">Theme: users want social features. "Users love sharing streaks with friends."<small>no source: nobody said this</small></div></div>
   <div class="cap" style="max-width:860px">AI fills gaps with what sounds right. The fix: no quote, no claim. Anything without a source is labelled <b>ASSUMPTION</b>.</div>`},

{module:'hallucination-map', scope:'lite'},

{module:'bias-mirror', scope:'lite'},

{sec:"SYNTHESIS", title:`SAMPLE <span class="g">RESEARCH SET</span>`,
 body:`<div class="mono sm" style="max-width:960px">research/habit-app.md<br>
   1. Interview: "Set it up Sunday, motivated. By Wednesday I forget it exists. No nudge."<br>
   2. Interview: "I have 12 habits in there. Overwhelming. I do not know which one matters today."<br>
   3. Review, 3 stars: "Nice design but I keep losing streaks, reminders fire late."<br>
   4. Review, 2 stars: "Too many features. I just want ONE thing to do today."<br>
   5. Tickets: about 40% are "notifications not arriving" or "streak reset wrong".<br>
   6. Survey: 68% of churned users stopped opening the app within 8 days.</div>
   <div class="cap" style="max-width:860px">Illustrative class data, not a real study. Use it if you have no research of your own.</div>`},

{module:'rctc-anatomy', scope:'lite'},

{module:'skills-anatomy', scope:'lite'},

{sec:"SYNTHESIS · task", title:`TASK 2 · BUILD THE <span class="g">DISCOVERY SKILL</span>`,
 body:`<span class="turn">Your turn · 15 min</span>
   <div class="mono sm"><span class="c">"Create a skill at .claude/skills/discovery-synth/SKILL.md.<br>
   Description: use when I ask to synthesize research, interviews, reviews or tickets.<br>
   Steps: 1. Read only the sources I name: files, or pages through my connector. 2. Cluster into 3 to 5 themes. 3. For each theme: sentiment, top pain, 1 to 2 exact quotes, and the source (file and line, or page link). 4. Any claim with no quote: label it ASSUMPTION. 5. End with 3 open questions to test next. 6. Never invent quotes, numbers or users. 7. Save to discovery.md."</span></div>
   <div class="cap" style="max-width:900px">Then run it: <b>"/discovery-synth on research/habit-app.md"</b> or <b>"/discovery-synth on my Notion page [name]"</b>.</div>`},

{module:'verification-ladder', scope:'lite'},

{sec:"SYNTHESIS · task", title:`CHECK IT · <span class="g">FIND THE QUOTE</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono sm"><ol class="steps2">
   <li>Open discovery.md. Pick 2 quotes.</li>
   <li>Open the source. Search for each quote (Cmd+F or Ctrl+F). Is it word for word?</li>
   <li>Ask: <span class="c">"For each theme, show the exact source line. Remove any theme you cannot back with a quote."</span></li>
   <li>Count the ASSUMPTION labels. Zero is suspicious.</li></ol></div>`},

{sec:"BREAK", title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Back in about 8 min. Connector still red? Grab me now.</div>`},

{sec:"PRD + STORIES", title:`PART 3 · <span class="g">PRD AND STORIES</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">From cited themes to a spec an engineer can pick up.</div>`},

{module:'five-fifty', scope:'lite'},

{sec:"PRD + STORIES", title:`A ONE-PAGE PRD, <span class="g">9 PARTS</span>`,
 body:`<div class="blocks" style="grid-template-columns:repeat(3,1fr);max-width:1040px;gap:10px">
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Problem</div><p>With quotes from discovery.md</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Goal + non-goals</div><p>What we will not do</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Target user</div><p>From the evidence only</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Core flow</div><p>The happy path, step by step</p></div>
   <div class="block" style="padding:12px 16px;border-left-color:var(--risk)"><div class="bl" style="font-size:18px;color:var(--risk)">Edge cases</div><p>The part people skip</p></div>
   <div class="block" style="padding:12px 16px;border-left-color:var(--risk)"><div class="bl" style="font-size:18px;color:var(--risk)">Error flows</div><p>What happens when it fails</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Constraints</div><p>What engineering will raise</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Success metric</div><p>One number, one target</p></div>
   <div class="block" style="padding:12px 16px"><div class="bl" style="font-size:18px">Open risks</div><p>3 riskiest assumptions</p></div></div>`},

{sec:"PRD + STORIES", cls:"viz", title:`A STORY AN ENGINEER <span class="g">CAN TEST</span>`,
 body:`<div class="mono sm" style="max-width:900px">
   <b style="color:var(--fg)">Story:</b> As a new user, I want one daily reminder at a time I pick, so that I do not forget the app by day 3.<br><br>
   <span class="c">Given</span> I set a reminder for 08:00 <span class="c">When</span> it is 08:00 on my phone <span class="c">Then</span> I get one notification.<br>
   <span class="c">Given</span> notifications are off on my phone <span class="c">When</span> I set a reminder <span class="c">Then</span> the app tells me how to turn them on. <span class="tag2 r">error path</span></div>
   <div class="cap" style="max-width:860px"><b>User story</b>: one line, who, what, why. <b>Acceptance criteria</b>: Given, When, Then. Each one passes or fails, no guessing.</div>`},

{sec:"PRD + STORIES · task", title:`TASK 3 · PRD AND <span class="g">STORIES</span>`,
 body:`<span class="turn">Your turn · 20 min</span>
   <div class="mono sm"><ol class="steps2">
   <li><span class="c">"Act as a senior PM. Use discovery.md. Pick the theme with the strongest evidence. Write a one-page PRD in prd.md with these parts: problem, goal and non-goals, target user, core flow, edge cases, error flows, constraints, success metric, open risks. Quote discovery.md for the problem. Mark anything not in the research as ASSUMPTION."</span></li>
   <li><span class="c">"Add 5 edge cases and one error flow for the core step."</span></li>
   <li><span class="c">"From prd.md, write 3 user stories in stories.md. Each has Given/When/Then criteria and one error path. Split any story too big for one sprint."</span></li>
   <li>Reuse Session 2: <span class="c">"/idea-scorer on the idea in prd.md. Add the score to Open risks."</span></li></ol></div>`},

{sec:"PUSH TO THE TOOL", cls:"viz", title:`PLAN, APPROVE, <span class="g">THEN WRITE</span>`,
 body:`<div class="plug">
   <div class="p"><b>1 · Plan mode</b><span>It shows what it will create. Nothing changes yet.</span></div><div class="ar">&rarr;</div>
   <div class="p"><b>2 · You check</b><span>Right project? Right titles? Right number of items?</span></div><div class="ar">&rarr;</div>
   <div class="p k"><b>3 · Approve</b><span>It creates the items. You approve each write.</span></div></div>
   <div class="cap" style="max-width:900px">Writing into a shared tool is the first time your agent changes something your team sees. Go slow once. Then it is routine.</div>`},

{sec:"PUSH TO THE TOOL · task", title:`TASK 4 · PUSH STORIES <span class="g">INTO YOUR TOOL</span>`,
 body:`<span class="turn">Your turn · 12 min</span>
   <div class="mono sm"><ol class="steps2">
   <li>Switch the mode to <span class="c">Plan</span>.</li>
   <li><span class="c">"Using my [Jira] connector, create the 3 stories from stories.md as issues in project [KEY]. Put the acceptance criteria in the description. Add the label ai-draft. Show me the plan first."</span></li>
   <li>Check the plan. Approve. Open the tool and see the issues.</li>
   <li>Docs tool instead? <span class="c">"Create a page 'PRD: [name]' in my [Notion] workspace from prd.md and stories.md."</span></li>
   <li>No tool? <span class="c">"Save stories.md as stories.csv with columns Summary, Description, Labels, ready to import."</span></li></ol></div>`},

{sec:"USE CASES", title:`SAME FLOW, <span class="g">YOUR WORLD</span>`,
 body:`<div class="ucg">
   <div class="u"><b>B2B SaaS PM</b><span><i>In:</i> Slack #feedback, sales call notes in Drive<br><i>Out:</i> stories in Jira</span></div>
   <div class="u"><b>Bank or fintech PM</b><span><i>In:</i> anonymized complaints in Confluence<br><i>Out:</i> PRD page with compliance constraints</span></div>
   <div class="u"><b>Consumer app PM</b><span><i>In:</i> app store reviews saved to a file<br><i>Out:</i> stories in Linear</span></div>
   <div class="u"><b>Design-heavy PM</b><span><i>In:</i> Figma or Penpot file plus research<br><i>Out:</i> PRD gaps the design misses</span></div>
   <div class="u"><b>Platform or API PM</b><span><i>In:</i> Jira bugs and support tickets<br><i>Out:</i> themes by root cause</span></div>
   <div class="u"><b>Startup or solo PM</b><span><i>In:</i> Notion interview notes<br><i>Out:</i> stories in Plane</span></div></div>`},

{sec:"RECAP", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:720px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>A connector is a plug. Start read only.</span></li>
   <li><span class="n">2</span><span>No quote, no claim. Label the rest ASSUMPTION.</span></li>
   <li><span class="n">3</span><span>Plan first, then let it write into team tools.</span></li></ul></div>`},
