{sec:"SESSION 2 · OPEN", title:`WHAT YOU <span class="g">BUILD TONIGHT</span>`, center:true,

{sec:"SESSION 2 · OPEN", title:`SETUP <span class="g">STATUS CHECK</span>`,
 body:`<div class="sub">Quick hands up:</div>

{sec:"SET UP YOUR WORKSPACE", title:`YOUR <span class="g">WORKSPACE</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>

{sec:"SET UP YOUR WORKSPACE", title:`THE STACK YOU ARE <span class="g">BUILDING</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">Claude</div><p>Chat and Projects. Where you think and ask.</p></div>
   <div class="block"><div class="bl">Claude Code</div><p>The terminal operator. Reads and writes real files.</p></div>
   <div class="block"><div class="bl">AI IDE</div><p>VS Code or Cursor. Where your project lives.</p></div>
   <div class="block"><div class="bl">Node</div><p>The plumbing that installs Claude Code.</p></div></div>`},

{sec:"SET UP YOUR WORKSPACE", title:`CLAUDE CODE IS THE <span class="g">OPERATOR</span>`,
 body:`<div class="sub">Not a chatbot that answers. An operator that acts.</div>
   <div class="rows">
   <div class="row"><span class="a">Reads your files</span><span class="arw">&rarr;</span><span class="b">proposes a change</span></div>
   <div class="row"><span class="a">Runs the step</span><span class="arw">&rarr;</span><span class="b">checks the result, repeats</span></div></div>
   <div class="cap" style="max-width:820px;margin:14px auto 0">The loop from Session 1: <b style="color:var(--green)">read the context, act, check, repeat.</b> You approve each step. That is the whole tool.</div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 1 · GET TO <span class="g">GREEN</span>`,
 body:`<span class="turn">Your turn · 3 min</span>
   <div class="mono"><ol class="steps2">
   <li>Sign in at <span class="c">claude.ai</span>, or open the Claude desktop app.</li>
   <li>Send one message: <span class="c">"Reply with OK if you can read this."</span></li>
   <li>See the reply. Your account is live.</li></ol></div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 2 · OPEN YOUR <span class="g">IDE</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono"><ol class="steps2">
   <li>Install <span class="c">VS Code</span> or <span class="c">Cursor</span> if you have not.</li>
   <li>File &rarr; Open Folder &rarr; make a new folder <span class="c">ai-pm-course</span>.</li>
   <li>Open the built-in terminal: View &rarr; Terminal.</li></ol></div>
   <img class="shot" src="../../assets/img/s2/vscode-terminal.png"><div class="shotcap">VS Code with the ai-pm-course folder open and the terminal panel</div>`},

{sec:"SET UP YOUR WORKSPACE · task", title:`TASK 3 · FIRST <span class="g">CLAUDE CODE</span> RUN`,

   <div class="mono"><ol class="steps2">
   <li>In the terminal: <span class="c">npm install -g @anthropic-ai/claude-code</span></li>
   <li>Run <span class="c">claude</span> and log in when prompted.</li>
   <li>One small command: <span class="c">"Create notes.md with the heading: My AI PM workspace."</span></li></ol></div>
   <img class="shot" src="../../assets/img/s2/claude-code-file.png"><div class="shotcap">Claude Code creating a real file on your machine</div>`},

{sec:"SET UP YOUR WORKSPACE · checkpoint", title:`CHECKPOINT · <span class="g">EVERYONE GREEN</span>`,

{sec:"CLAUDE.MD + CONTEXT", title:`A NEW HIRE WITH <span class="g">NO ONBOARDING</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:#fff">A blank Claude Code is a sharp new hire on day one.</div>
   <div class="sub">It knows a lot in general, and nothing about your bank, your product, or your rules. The fix is one file.</div>`},

{sec:"CLAUDE.MD + CONTEXT", title:`CLAUDE.md · THE <span class="g">RULES</span>`,
 body:`<div class="sub">A plain Markdown file at the top of a project. Claude Code reads it every time, automatically.</div>
   <ul class="checklist"><li>What this project is</li><li>How to run it</li><li>The conventions to follow</li><li>The safety lines it must not cross</li></ul>
   <div class="cap" style="max-width:840px;margin:12px auto 0">At a bank: <b>"This is the cards backlog. Never paste real card or KYC data. Keep answers short and cite the source."</b> Good CLAUDE.md, good behavior. Thin or missing, generic behavior.</div>`},

{sec:"CLAUDE.MD + CONTEXT", title:`CONTEXT = ITS <span class="g">WORKING MEMORY</span>`,
 body:`<div class="sub">Everything loaded right now: your CLAUDE.md, the files you opened, this conversation. Nothing outside it exists to the model.</div>
   <img class="shot" src="../../assets/img/s2/context-chat.png"><div class="shotcap">A working session with the project context loaded in</div>`},

{sec:"CLAUDE.MD + CONTEXT · task", title:`TRY IT · YOUR FIRST <span class="g">CLAUDE.md</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono"><ol class="steps2">
   <li>In your <span class="c">ai-pm-course</span> folder, tell Claude Code:<br><span class="c">"Create a CLAUDE.md. This folder is my AI-for-PM course workspace. I am a PM at a bank. Keep answers short. Never invent facts. Never use real customer data."</span></li>
   <li>Then ask: <span class="c">"What is this project?"</span></li>
   <li>Watch it answer from the file you just wrote.</li></ol></div>`},

{sec:"WHERE IT ALL LIVES", title:`WHERE DOES IT ALL <span class="g">LIVE?</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="color:#fff">You will make skills, rules, and hooks.</div>
   <div class="sub">Each one lives in one of two places. Put it in the wrong one and it either follows you everywhere or nowhere.</div>`},

{sec:"WHERE IT ALL LIVES", title:`TWO HOMES · <span class="g">GLOBAL VS PROJECT</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">Global</div><p><span class="c" style="font-family:var(--m)">~/.claude/</span> Loads in every project. Your defaults: your voice, your always-on rules.</p></div>
   <div class="block"><div class="bl">Project</div><p><span class="c" style="font-family:var(--m)">.claude/</span> in the folder. Loads only here. Travels with the repo when you share it.</p></div></div>
   <div class="cap" style="max-width:840px;margin:12px auto 0">Skills, CLAUDE.md rules, and hooks can each sit in either home. Same file, different reach.</div>`},

{sec:"WHERE IT ALL LIVES", title:`WHICH GOES <span class="g">WHERE</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Personal, always true</span><span class="arw">&rarr;</span><span class="b"><b>global</b> · your writing voice, your verify-facts rule</span></div>
   <div class="row"><span class="a">Product or team specific</span><span class="arw">&rarr;</span><span class="b"><b>project</b> · a payments compliance check, this repo's build steps</span></div></div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">Rule of thumb: if it should follow <b>you</b> everywhere, global. If it belongs to one product or one team, project.</div>`},

{sec:"BREAK", title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub">Back in ~8 min. If your setup fought you, grab me now and we fix it.</div>`},

{sec:"YOUR FIRST SKILL", title:`YOU KEEP RETYPING THE <span class="g">SAME PROMPT</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:#fff">Every week, the same long prompt to score a backlog idea.</div>
   <div class="sub">A skill saves that prompt once, then runs it on command. Time to build one.</div>`},

{sec:"YOUR FIRST SKILL", title:`WHAT A <span class="g">SKILL</span> IS`,
 body:`<div class="sub">A skill is a Markdown recipe: a <b style="color:#fff">name</b>, a <b style="color:#fff">description</b>, and the <b style="color:#fff">steps.</b> The description is the trigger: "use this when...".</div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">No code, no install. One file: <b style="color:var(--green)">.claude/skills/&lt;name&gt;/SKILL.md</b>. Think of it as a saved R&middot;C&middot;T&middot;C prompt from your Field Kit, now reusable on demand.</div>`},

{sec:"YOUR FIRST SKILL", title:`THE EXAMPLE · <span class="g">IDEA-SCORER</span>`,
 body:`<div class="sub">In our demo project, one skill scores any backlog idea the same way every time: reach, effort, risk, a total, a call.</div>
   <div class="cap" style="max-width:840px;margin:14px auto 0">So <b>"add instant KYC onboarding"</b> and <b>"redesign the card screen"</b> get judged on the same rubric, not on mood. Consistent scoring is the point.</div>`},

{sec:"YOUR FIRST SKILL · live", title:`LIVE · BUILD IT FROM <span class="g">ZERO</span>`,
 body:`<span class="turn">Watch me first</span>
   <div class="mono"><ol class="steps2">
   <li>In the demo folder, I tell Claude Code:<br><span class="c">"Create a skill at .claude/skills/idea-scorer/SKILL.md. Name: idea-scorer. Description: use this to score a product idea. Steps: rate reach, effort, and risk 1 to 5, then give a total and a ship or hold call."</span></li>
   <li>Then: <span class="c">"Score this idea: instant KYC onboarding for new current accounts."</span></li>
   <li>It writes the file, then uses it. I approve each step.</li></ol></div>
   <div class="cap" style="max-width:800px;margin:12px auto 0">That is a skill: <b style="color:var(--green)">written once, run forever.</b></div>`},

{sec:"YOUR FIRST SKILL · task", title:`NOW YOU · BUILD THE <span class="g">SKILL</span>`,
 body:`<span class="turn">Your turn · 8 min</span>
   <div class="mono"><ol class="steps2">
   <li>Same command I just ran: create <span class="c">.claude/skills/idea-scorer/SKILL.md</span> with a name, a "use this when" description, and the scoring steps.</li>
   <li>Approve as it writes the file.</li>
   <li>Confirm the file exists in your folder.</li></ol></div>
   <img class="shot" src="../../assets/img/s2/claude-code-file.png"><div class="shotcap">Claude Code writing your SKILL.md</div>`},

{sec:"YOUR FIRST SKILL · task", title:`WIRE ONE SMALL <span class="g">AUTOMATION</span>`,
 body:`<span class="turn">Your turn · 6 min</span>
   <div class="mono"><ol class="steps2">
   <li>Run your skill on a real idea:<br><span class="c">"Score this idea: [one idea from your own backlog]."</span></li>
   <li>Then: <span class="c">"Save the idea and its score to ideas.md."</span></li>
   <li>Next week, one line reruns the whole thing.</li></ol></div>`},

{sec:"YOUR FIRST SKILL · checkpoint", title:`CHECKPOINT · YOUR SKILL <span class="g">RUNS</span>`,
 body:`<ul class="checklist"><li>SKILL.md exists in your folder</li><li>It scored a real idea</li><li>The score saved to ideas.md</li></ul>
   <div class="sub">That file and that skill are yours. This is tonight's milestone.</div>`},

{sec:"RECAP &amp; HOMEWORK", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:700px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>Claude Code is an operator. It reads, acts, checks. You approve.</span></li>
   <li><span class="n">2</span><span>CLAUDE.md is the rules, always in context. Global follows you, project stays put.</span></li>
   <li><span class="n">3</span><span>A skill is a saved recipe. Build once, run forever.</span></li></ul></div>`},
