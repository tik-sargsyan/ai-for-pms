{sec:"OPEN & FRAME · done today", title:`DONE TODAY = <span class="g">3 THINGS</span>`,
 body:`<ul class="checklist"><li>It runs locally. You can click it.</li><li>One core feature works end to end.</li><li>It passes your own judge (from Session 6).</li></ul>`},

{sec:"OPEN & FRAME · two habits", title:`THE DAY IS <span class="g">TWO HABITS</span>`,
 body:`<div class="arc"><span class="st">Describe</span><span class="ar">→</span><span class="st">Generate</span><span class="ar">→</span><span class="st">Run</span><span class="ar">→</span><span class="st final">Fix</span></div>
   <div class="cap"><b>R·C·T·C prompts:</b> Role · Context · Task · Critique. Keep every prompt small and iterative.</div>`},

{sec:"RUTHLESS SCOPING", title:`SCOPE LIKE A <span class="g">KNIFE</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Cut until it hurts, then cut once more.</div>`},

{sec:"RUTHLESS SCOPING", title:`PROTOTYPE <span class="g">OR</span> MVP`,

   <div class="cap">Pick ONE today. Neither is a full product. Choose the smaller of your two instincts.</div>`},

{sec:"RUTHLESS SCOPING", title:`EVERY PRODUCT HAS ONE <span class="g">MAGIC MOMENT</span>`,
 body:`<div class="sub">The single action where the user goes "oh, nice." Build only that. Everything else is later.</div>
   <div class="ph"><div class="pl"><div class="pk">Screenshot</div><div class="pt">A running local prototype at its magic moment: an idea pasted in, a score + verdict appearing below</div></div></div>`},

{sec:"RUTHLESS SCOPING", title:`THE <span class="g">FOUR CUTS</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · Auth</div><p>Skip. Nobody logs in today.</p></div>
   <div class="block"><div class="bl">2 · Real data</div><p>Mock it with fake JSON.</p></div>
   <div class="block"><div class="bl">3 · Backend / DB</div><p>Skip. Keep it in the page.</p></div>
   <div class="block"><div class="bl">4 · Polish</div><p>Last. Only if time.</p></div></div>`},

{sec:"RUTHLESS SCOPING · story", title:`EVERYTHING I BUILT STARTED AS <span class="g">ONE FEATURE</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">One Thing (Arete)</span><span class="arw">→</span><span class="b">one <b>today's ONE thing</b> box</span></div>
   <div class="row"><span class="a">Catan</span><span class="arw">→</span><span class="b">the board just <b>renders</b></span></div>
   <div class="row"><span class="a">Book RAG</span><span class="arw">→</span><span class="b">ask one question, get <b>one answer</b></span></div></div>
   <div class="cap">The rest came later. Big things are one small feature that survived.</div>`},

   <li>Mock data: what fake data the feature needs.</li>

{sec:"BUILD STACK", title:`YOUR <span class="g">BUILD STACK</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Three tools, that's it.</div>`},

{sec:"BUILD STACK", title:`THE <span class="g">STACK</span>`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · VS Code</div><p>Where the files live. Your editor.</p></div>
   <div class="block"><div class="bl">2 · Claude Code</div><p>The AI that writes and runs code, in the terminal.</p></div>
   <div class="block"><div class="bl">3 · Browser</div><p>Where your app runs, locally.</p></div></div>`},

{sec:"BUILD STACK · screenshot", title:`THIS IS THE <span class="g">TARGET</span>`,
 body:`<div class="sub">Editor on the left, Claude Code terminal below, app in the browser.</div>
   <div class="ph"><div class="pl"><div class="pk">Screenshot</div><div class="pt">VS Code with a project folder open + Claude Code running in the integrated terminal + a browser tab showing the app on localhost</div></div></div>`},

{sec:"BUILD STACK · your turn", title:`TASK 2 · <span class="g">STAND UP YOUR PROJECT</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono">
   <ol class="steps2">
   <li>Make a folder: <span class="c">capstone-&lt;yourname&gt;</span>.</li>
   <li>Open it in VS Code (File → Open Folder).</li>
   <li>Open the terminal (View → Terminal).</li>
   <li>Start Claude Code: type <span class="c">claude</span>.</li>
   <li>First prompt (small): "Create a single-page app: one <span class="c">index.html</span> with a title and a heading that says [your app name]. Nothing else yet."</li>
   <li>Run it: open <span class="c">index.html</span> in the browser (or ask Claude Code to serve it locally).</li>
   </ol></div>`},

{sec:"BUILD STACK", title:`PROMPT IT LIKE A <span class="g">SHARP JUNIOR DEV</span>`,
 body:`<div class="sub">Role + Context + Task + Critique. The same R·C·T·C, aimed at code.</div>
   <ul class="checklist">
   <li>One feature per prompt.</li>
   <li>Ask for small edits to named files, never "rebuild everything."</li>
   <li>Let it run and read its own errors.</li>
   <li>Start a fresh chat when it gets slow.</li></ul>`},

{sec:"BUILD STACK · checkpoint", title:`CHECKPOINT <span class="g">✓</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Your app opens in the browser and shows your title. Not working? Keep the common-fixes slide handy.</div>`},

{sec:"BREAK", title:`<span class="g">8-MINUTE</span> BREAK`, center:true,
 body:`<div class="rule"></div><div class="sub">Back at [time]. Leave your skeleton running. Don't close anything.</div>`},

{sec:"BUILD THE CORE", title:`BUILD THE <span class="g">CORE</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">describe → generate → run → fix → repeat</div>`},

{sec:"BUILD THE CORE", title:`THE <span class="g">LOOP</span>, IN DETAIL`,
 body:`<div class="blocks">
   <div class="block"><div class="bl">1 · Describe</div><p>Tell Claude Code the ONE next small thing.</p></div>
   <div class="block"><div class="bl">2 · Generate</div><p>It writes or edits the file.</p></div>
   <div class="block"><div class="bl">3 · Run</div><p>Refresh the browser and actually look.</p></div>
   <div class="block"><div class="bl">4 · Fix</div><p>Paste the error or say what's wrong, then loop.</p></div></div>
   <div class="cap">Repeat until the magic moment works. One brick, place it, next brick.</div>`},

{sec:"BUILD THE CORE", title:`FAKE IT BEFORE YOU <span class="g">MAKE IT</span>`,
 body:`<div class="sub">Mock data = fake data hard-coded in the page. A small JSON array is enough to build the whole feature. Real data is a Session-8 problem.</div>
   <div class="ph"><div class="pl"><div class="pk">Screenshot</div><div class="pt">A small mock-data JSON array at the top of index.html in VS Code, about 8 fake items</div></div></div>`},

{sec:"BUILD THE CORE · your turn", title:`TASK 3 · <span class="g">BUILD THE MAGIC MOMENT</span>`,
 body:`<span class="turn">Your turn · 18 min</span>
   <div class="mono">
   <ol class="steps2">
   <li>Prompt (R·C·T·C, small): "You are my front-end dev. This is a single-page app for [user + problem]. Add ONLY the core feature: [the one interaction]. Keep it all in <span class="c">index.html</span>. Flag anything risky before you build."</li>
   <li>RUN it. Look in the browser.</li>
   <li>Iterate in small prompts: "the button does nothing, wire it up," "show the result below the input."</li>
   <li>Loop until the magic moment works once, end to end.</li>
   </ol></div>`},

{sec:"BUILD THE CORE · your turn", title:`TASK 4 · <span class="g">WIRE MOCK DATA + THE FLOW</span>`,
 body:`<span class="turn">Your turn · 12 min</span>
   <div class="mono">
   <ol class="steps2">
   <li>"Add a mock data array of about 8 realistic [items] at the top of the file."</li>
   <li>"Make the feature read from that array instead of the hard-coded example."</li>
   <li>Walk the ONE path a user takes, start to finish. Fix only what breaks on that path.</li>
   </ol></div>`},

{sec:"BUILD THE CORE · troubleshooting", title:`STUCK? <span class="g">COMMON FIXES</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Blank page</span><span class="arw">→</span><span class="b">open the console (F12), paste the <b>red error</b> to Claude Code</span></div>
   <div class="row"><span class="a">Won't run</span><span class="arw">→</span><span class="b">give it the <b>exact</b> command + message</span></div>
   <div class="row"><span class="a">It over-built</span><span class="arw">→</span><span class="b">"undo the extra, keep only [feature]"</span></div>
   <div class="row"><span class="a">Slow / looping</span><span class="arw">→</span><span class="b"><b>fresh chat</b>, paste the current file</span></div>
   <div class="row"><span class="a">Lost</span><span class="arw">→</span><span class="b">describe what you <b>SEE</b> vs what you <b>WANT</b></span></div></div>`},

{sec:"BUILD THE CORE · checkpoint", title:`CHECKPOINT <span class="g">✓</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Your ONE feature works end to end, on mock data. If yes, you have a prototype. Now make it hold up.</div>`},

{sec:"MAKE IT HOLD UP", title:`MAKE IT <span class="g">HOLD UP</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">The judge + guardrails, from Session 6.</div>`},

{sec:"MAKE IT HOLD UP", title:`YOUR CHECKLIST <span class="g">IS YOUR JUDGE</span>`,
 body:`<div class="sub">Your judge = a tiny checklist your product must pass.</div>
   <ul class="checklist">
   <li>Empty input handled.</li>
   <li>Bad input handled.</li>
   <li>The magic moment works 3× in a row.</li>
   <li>Nothing crashes.</li></ul>
   <div class="cap">Write it. Run it. Fix the fails. Every fail becomes your next prompt.</div>`},

{sec:"MAKE IT HOLD UP", title:`<span class="g">GUARDRAILS</span>`,
 body:`<div class="sub">Guardrails = what happens when things go wrong.</div>
   <ul class="checklist">
   <li>Empty state: nothing entered yet.</li>
   <li>Error state: bad input.</li>
   <li>Loading state: if it has to wait.</li>
   <li>If AI is IN your product: ground or verify. Never show a raw guess as fact.</li></ul>`},

{sec:"MAKE IT HOLD UP · your turn", title:`TASK 5 · <span class="g">JUDGE IT + GUARD IT</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono">
   <ol class="steps2">
   <li>Write your 4-5 check judge (in a comment or a note).</li>
   <li>Run every check by hand, like a clumsy user. Note the fails.</li>
   <li>Prompt small fixes: "handle empty input with a friendly message," "if input is invalid, show a clear error, don't crash."</li>
   <li>Add at least 2 guardrails. Re-run the judge.</li>
   </ol></div>`},

{sec:"MAKE IT HOLD UP · checkpoint", title:`CHECKPOINT <span class="g">✓</span>`, center:true,
 body:`<div class="rule"></div><div class="sub">Your product passes your own judge + has 2 or more guardrails. It no longer breaks when poked.</div>`},

{sec:"IN FRONT OF A HUMAN · your turn", title:`TASK 6 · <span class="g">PUT IT IN FRONT OF A HUMAN</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono">
   <ol class="steps2">
   <li>Turn to your neighbor. Hand them your laptop.</li>
   <li>Say ONE sentence about what it does, then stay silent. Watch them use it.</li>
   <li>Write down the FIRST thing that confused them. Don't fix it now.</li>
   </ol></div>`},

{sec:"IN FRONT OF A HUMAN", title:`LOCK IN <span class="g">TODAY'S WIN</span>`,
 body:`<div class="sub">Before you close the laptop, protect the win.</div>
   <ul class="checklist">
   <li>Save the folder (and commit if you set up git in Session 2).</li>
   <li>Note what works, your one confusion fix, and what's still mocked.</li>
   <li>Next session = deploy this exact thing live.</li></ul>`},

{sec:"RECAP & NEXT", title:`THE THREE THAT <span class="g">MATTER</span>`,
 body:`<ul class="recaplist">
   <li><span class="n">1</span><span>Scope to ONE feature. Cut until it hurts.</span></li>
   <li><span class="n">2</span><span>Build in the loop, small prompts: describe → run → fix.</span></li>
   <li><span class="n">3</span><span>A judge + guardrails turn a demo into a product.</span></li></ul>`},

{sec:"RECAP & NEXT · homework", title:`<span class="g">HOMEWORK</span> (KEEP IT SMALL)`,
 body:`<ul class="checklist">
   <li>Keep it running. Do NOT add new features.</li>
   <li>Fix the ONE confusion your neighbor hit.</li>
   <li>Harden: run your judge again, add 1 more guardrail.</li>
   <li>Bring the folder + a free Netlify account, ready to deploy.</li></ul>`},
