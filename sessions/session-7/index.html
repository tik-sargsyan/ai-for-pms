{sec:"SESSION 7 · OPEN", title:`CAPSTONE I: <span class="g">BUILD THE PRODUCT</span>`, center:true,
 body:`<div class="sub">Tonight your idea stops being a document. It becomes an app with a link.</div>
   <div style="display:flex;justify-content:center;margin:22px 0 4px">${AST}</div>
   <div class="tbar" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="font-size:16px">Tigran Sargsyan · AI for Product Managers · Session 7</div>`},

{module:'s6-recap', scope:'open'},

{sec:"SESSION 7 · OPEN", title:`TONIGHT YOU <span class="g">BUILD</span>`,
 body:`<div class="bigbox"><div class="k">Deliverable</div><div class="v">A working app with <b style="color:var(--accent)">one core feature</b>, running on your laptop, with the code saved on <b>GitHub</b>.</div></div>
   <ul class="checklist" style="margin-top:18px"><li>A one-page PRD with 3 to 5 acceptance criteria</li><li>One core feature works, start to finish, on fake data</li><li>It runs on your laptop at a local link</li><li>The code lives in a private GitHub repo</li></ul>
   <div class="cap">Session 8 puts it online. Tonight: working and saved.</div>`},

{sec:"SCOPE LIKE A KNIFE", title:`FIND THE <span class="g">MAGIC MOMENT</span>`,
 body:`<div class="cards"><div class="card good"><div class="tag">Build tonight</div><p>The one action where the user says "oh, nice." Paste an idea, see a score. Type a note, see it sorted.</p></div>
   <div class="card bad"><div class="tag">Later</div><p>Login, settings, dashboards, payments, admin pages, dark mode, a second user type.</p></div></div>
   <div class="cap">Can you say it in one sentence, and build it in about 60 minutes? If not, cut again.</div>`},

{sec:"SCOPE LIKE A KNIFE", title:`THE <span class="g">FOUR CUTS</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Login</span><span class="arw">&rarr;</span><span class="b">skip. Nobody signs in tonight.</span></div>
   <div class="row"><span class="a">Real data</span><span class="arw">&rarr;</span><span class="b"><b>mock data</b>: a small file of fake, realistic examples</span></div>
   <div class="row"><span class="a">Database</span><span class="arw">&rarr;</span><span class="b">skip. Keep data in a file in the project.</span></div>
   <div class="row"><span class="a">AI inside the app</span><span class="arw">&rarr;</span><span class="b">Session 8. Fake the AI output tonight.</span></div></div>`},

{module:'vibe-coding-stack', scope:'lite', sec:"YOUR BUILD STACK"},

{module:'github-basics', scope:'lite', sec:"SHIP A PREVIEW EARLY"},

{sec:"YOUR BUILD STACK", title:`PLAN MODE <span class="g">FIRST</span>`,
 body:`<div class="cards"><div class="card bad"><div class="tag">Without a plan</div><p>"Build my app." It guesses the stack, adds features you cut, and burns your tokens.</p></div>
   <div class="card good"><div class="tag">Plan mode</div><p>It reads your PRD, proposes files and steps, and changes nothing until you approve.</p></div></div>
   <div class="cap">You are the PM of this build. Read the plan like a spec review. Push back before a line is written.</div>`},

{sec:"BUILD THE CORE", cls:"viz", title:`THE BUILD <span class="g">LOOP</span>`,
 body:`<div class="flow">
   <div class="st"><b>1 · Describe</b><span>One small next step. One feature per prompt.</span></div><div class="ar">&rarr;</div>
   <div class="st"><b>2 · Build</b><span>Claude Code edits files. You approve.</span></div><div class="ar">&rarr;</div>
   <div class="st"><b>3 · Run</b><span>Refresh the browser. Look with your eyes.</span></div><div class="ar">&rarr;</div>
   <div class="st hot"><b>4 · Fix</b><span>Say what you SEE and what you WANT.</span></div></div>
   <div class="rows" style="margin-top:18px">
   <div class="row"><span class="a">Session slow or confused?</span><span class="arw">&rarr;</span><span class="b">start a new session. CLAUDE.md and PRD.md carry the context.</span></div></div>`},

{sec:"BUILD THE CORE", title:`LET YOUR <span class="g">JUDGE</span> CHECK IT`,
 body:`<div class="sub" style="margin-top:0">Your S5 judge agent scores the app against your own acceptance criteria.</div>
   <div class="mono tight" style="margin-top:16px"><span class="c">"Ask my judge agent to check the app against the acceptance criteria in PRD.md. For each one: pass or fail, and why. Then list the fails, most serious first."</span></div>
   <div class="rows" style="margin-top:16px">
   <div class="row"><span class="a">Fail</span><span class="arw">&rarr;</span><span class="b">that fail is your next prompt</span></div>
   <div class="row"><span class="a">All pass</span><span class="arw">&rarr;</span><span class="b">you click it yourself, then commit and push</span></div></div>`},

{sec:"NOW BUILD · task", title:`THE BUILD <span class="g">PROMPT</span>`,
 body:`<span class="turn">Your turn · 45 min</span>
   <div class="cap" style="margin:0 0 10px">New folder <span class="c">capstone</span>, open it in the Code tab, switch to <b>Plan</b> mode. Paste this. Swap the highlighted <b>[brackets]</b> for your own idea.</div>
   <div class="mono tight" style="font-size:clamp(13px,1.25vw,16px);line-height:1.5"><span class="c">"I want to build <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[a meeting-notes sorter]</b>. User: <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[a team lead]</b>. Problem: <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[action items get lost after meetings]</b>. Magic moment: <b style="color:var(--fg);background:color-mix(in srgb,var(--accent) 25%,transparent);padding:0 4px;border-radius:4px">[paste notes, see the action items sorted by owner]</b>.<br>
   1. Use my PRD skill to write PRD.md, one page: user, problem, the ONE core feature, 3 to 5 acceptance criteria, and a NOT building list.<br>
   2. Plan a Next.js web app for that feature only. Put 8 realistic fake examples in data/mock.json. No login, no database, no real customer data. If the feature needs AI, show a fixed example for now.<br>
   3. Add to CLAUDE.md: this project, the PRD, and: never use real customer data.<br>
   Show me the plan. Build nothing until I approve."</span></div>
   <div class="cap" style="margin-top:10px">Read the plan. Cut what is not the magic moment. Approve. Then: <span class="c">"Start the dev server and give me the local link."</span> Then loop: what you SEE, what you WANT.</div>`},

{sec:"NOW BUILD · task", title:`SAVE IT TO <span class="g">GITHUB</span>`,
 body:`<span class="turn">Your turn · 10 min</span>
   <div class="mono tight"><ol class="steps2">
   <li><span class="c">"Set up git in this folder. Make sure .gitignore excludes node_modules and any .env files. Commit everything with the message: v1."</span></li>
   <li><span class="c">"Install the GitHub CLI if it is missing. Log me in to GitHub with the web browser flow and show me the one-time code."</span> Open <span class="c">github.com/login/device</span>, paste the code, click <b>Authorize</b>.</li>
   <li><span class="c">"Create a private repo named capstone under my personal account and push main."</span></li>
   <li>Open it on github.com. Your files are there. After each fix: <span class="c">"Commit and push."</span></li></ol></div>
   <div class="cap">Login stuck? Use <b>GitHub Desktop</b>: sign in, add this folder, click <b>Publish repository</b>.</div>`},

{sec:"WHEN IT BREAKS", title:`WHEN IT <span class="g">BREAKS</span>`,
 body:`<table class="tb">
   <tr><td>blank page</td><td>Open the browser console (Cmd+Option+J on Mac, Ctrl+Shift+J on Windows). Paste the red error to Claude Code.</td></tr>
   <tr><td>local link does not open</td><td>"Start the dev server again and give me the link." Keep that terminal open.</td></tr>
   <tr><td>git push asks for a password</td><td>Ask Claude Code to log you in to GitHub with the web browser flow, then push again.</td></tr>
   <tr><td>it built too much</td><td>"Undo everything not in PRD.md." Or rewind the session.</td></tr>
   <tr><td>going in circles</td><td>New session. Say what you SEE and what you WANT.</td></tr></table>`},

{sec:"HAND IT TO A HUMAN", title:`HAND IT TO A <span class="g">HUMAN</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono tight"><ol class="steps2">
   <li>Turn your laptop to your neighbor. Your app is open at the local link.</li>
   <li>Say one sentence about what it does. Then stay silent.</li>
   <li>Write down the first thing that confused them. Do not fix it now.</li>
   <li><span class="c">"Add to PRD.md under Feedback: [what confused them]."</span></li></ol></div>`},
